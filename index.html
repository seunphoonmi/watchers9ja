// ── TOAST SYSTEM ────────────────────────────────────────────────────────────
let _toastCounter = 0;
const _toastListeners = new Set();

const toast = {
  _emit(data) {
    const id = ++_toastCounter;
    const item = { id, ...data };
    _toastListeners.forEach(fn => fn(prev => [...prev, item]));
    setTimeout(() => {
      const el = document.getElementById(`toast-${id}`);
      if (el) el.classList.add('exiting');
      setTimeout(() => {
        _toastListeners.forEach(fn => fn(prev => prev.filter(t => t.id !== id)));
      }, 260);
    }, data.duration || 4500);
    return id;
  },
  success(title, msg) { return this._emit({ type:'success', icon:'✅', title, msg }); },
  error(title, msg)   { return this._emit({ type:'error',   icon:'❌', title, msg, duration: 6000 }); },
  warning(title, msg) { return this._emit({ type:'warning', icon:'⚠️', title, msg }); },
  info(title, msg)    { return this._emit({ type:'info',    icon:'ℹ️', title, msg }); },
};

function ToastContainer() {
  const [toasts, setToasts] = useState([]);
  useEffect(() => {
    _toastListeners.add(setToasts);
    return () => _toastListeners.delete(setToasts);
  }, []);
  const dismiss = (id) => {
    const el = document.getElementById(`toast-${id}`);
    if (el) el.classList.add('exiting');
    setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 260);
  };
  if (!toasts.length) return null;
  return ReactDOM.createPortal(
    toasts.map(t => (
      <div key={t.id} id={`toast-${t.id}`} className={`toast ${t.type}`}>
        <span className="toast-icon">{t.icon}</span>
        <div className="toast-body">
          <div className="toast-title">{t.title}</div>
          {t.msg && <div className="toast-msg">{t.msg}</div>}
        </div>
        <button className="toast-close" onClick={() => dismiss(t.id)}>×</button>
      </div>
    )),
    document.getElementById('toast-root')
  );
}

}

// ── TASK CARD ─────────────────────────────────────────────────────────────
function TaskCard({ task, onComplete, globalUserTasksState }) {
  const isDone = globalUserTasksState?.[task.id] || globalUserTasksState?.[String(task.id)] || false;
  const [state, setState] = useState(isDone ? 'done' : 'idle');
  const [secs, setSecs] = useState(30);
  const timerRef = useRef(null);

  useEffect(() => {
    if (globalUserTasksState?.[task.id] || globalUserTasksState?.[String(task.id)]) setState('done');
  }, [globalUserTasksState, task.id]);

  const startTask = () => {
    window.open(task.url, '_blank');
    setState('counting');
    let s = 30;
    timerRef.current = setInterval(() => {
      s--;
      setSecs(s);
      if (s <= 0) {
        clearInterval(timerRef.current);
        setState('done');
        onComplete(task.id, task.reward);
        toast.success('Task Completed!', `+${naira(task.reward)} has been credited to your balance.`);
      }
    }, 1000);
  };
  useEffect(() => () => clearInterval(timerRef.current), []);

  const tc = TASK_COLOR_MAP[task.type] || TASK_COLOR_MAP.video;
  const done = state === 'done';

  return (
    <div className={`task-card ${done ? 'done' : ''}`} style={{ borderLeft: `3px solid ${tc.border}` }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 14, flex: 1, minWidth: 0 }}>
        <div style={{ width: 40, height: 40, borderRadius: 10, background: tc.bg, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 18, flexShrink: 0 }}>
          {TASK_ICON[task.type]}
        </div>
        <div style={{ minWidth: 0 }}>
          <div style={{ fontWeight: 700, fontSize: 14, marginBottom: 5, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis', color: 'var(--text)' }}>{task.title}</div>
          <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap' }}>
            <span className="badge" style={{ background: tc.bg, color: tc.text, border: `1px solid ${tc.border}`, fontSize: 11, fontWeight: 700 }}>{task.type}</span>
            <span className="badge" style={{ background: 'var(--gold-light)', color: 'var(--gold)', border: '1px solid #fcd34d', fontSize: 11, fontWeight: 700 }}>+{naira(task.reward)}</span>
          </div>
        </div>
      </div>
      <div style={{ flexShrink: 0 }}>
        {done ? (
          <div style={{ display: 'flex', alignItems: 'center', gap: 6, color: 'var(--green)', fontWeight: 700, fontSize: 13 }}>
            <span style={{ width: 22, height: 22, borderRadius: '50%', background: 'var(--green-light)', display: 'inline-flex', alignItems: 'center', justifyContent: 'center', fontSize: 11 }}>✓</span>
            Credited
          </div>
        ) : state === 'idle' ? (
          <button className="btn btn-primary btn-sm" onClick={startTask}>Start</button>
        ) : (
          <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 5 }}>
            <div className="timer-ring">
              <span style={{ color: 'var(--gold)', fontWeight: 900, fontSize: 15 }}>{secs}s</span>
            </div>
            <div className="progress-track" style={{ width: 52 }}>
              <div className="progress-fill" style={{ width: `${((30-secs)/30)*100}%`, background: 'var(--gold)' }} />
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

// ── AUTH PAGE ─────────────────────────────────────────────────────────────
function AuthPage({ mode, setScreen, onLoginSuccess, initialSelectedPlan, onRegisterNewUser }) {
  const isLogin = mode === 'login';
  const [step, setStep] = useState(1);
  const [selectedPlan, setSelectedPlan] = useState(initialSelectedPlan || 'basic');
  const [formData, setFormData] = useState({ name: '', email: '', phone: '', password: '' });
  const [isProcessing, setIsProcessing] = useState(false);

  useEffect(() => { if (initialSelectedPlan) setSelectedPlan(initialSelectedPlan); }, [initialSelectedPlan]);

  const setF = (k, v) => setFormData(p => ({ ...p, [k]: v }));

  const handleSubmit = async (e) => {
    e.preventDefault();
    setIsProcessing(true);
    const inputEmail = formData.email.toLowerCase().trim();
    const inputPassword = formData.password;

    if (isLogin && inputEmail === 'admin@naijawatchers.com' && inputPassword === 'Passme2026@@@!') {
      setIsProcessing(false);
      toast.success('Admin Access Granted', 'Welcome to the command center.');
      onLoginSuccess('admin', { id: 'admin', name: 'System Administrator', email: inputEmail });
      return;
    }

    try {
      if (isLogin) {
        const { data, error } = await db.auth.signInWithPassword({ email: inputEmail, password: inputPassword });
        if (error) throw error;
        const { data: profile, error: pErr } = await db.from('profiles').select('*').eq('id', data.user.id).single();
        if (pErr || !profile) { toast.error('Profile Error', 'Account found but profile data is missing.'); return; }
        if (!profile.paid) { toast.error('Access Denied', 'Registration found, but no activation payment detected.'); return; }
        toast.success('Login Successful', `Welcome back, ${profile.name.split(' ')[0]}!`);
        onLoginSuccess(profile.plan, profile);
      } else {
        setStep(2);
      }
    } catch (err) {
      toast.error('Authentication Failed', err.message || 'Please check your credentials and try again.');
    } finally {
      setIsProcessing(false);
    }
  };

  const handlePaystack = () => {
    const email = formData.email.toLowerCase().trim();
    const name = formData.name.trim();
    if (!email || !name) { toast.error('Missing Info', 'Please fill in your name and email.'); setStep(1); return; }
    if (typeof window.PaystackPop === 'undefined') { toast.error('Payment Error', 'Paystack failed to load. Please refresh.'); return; }
    const amountKobo = (selectedPlan === 'premium' ? 8000 : 4000) * 100;
    try {
      const paystack = new window.PaystackPop();
      paystack.newTransaction({
        key: 'pk_live_56cd68f5adb0e165c34545bee318900fcd3505e3',
        email: email,
        amount: amountKobo,
        currency: 'NGN',
        metadata: {
          custom_fields: [
            { display_name: 'Full Name', variable_name: 'customer_name', value: formData.name },
            { display_name: 'Plan', variable_name: 'plan', value: selectedPlan }
          ]
        },
        onSuccess: async (transaction) => {
          toast.info('Payment Received', `Ref: ${transaction.reference} — Setting up your account…`);
          setIsProcessing(true);
          try {
            const { data: authData, error: authError } = await db.auth.signUp({ email: formData.email.toLowerCase().trim(), password: formData.password });
            if (authError) throw authError;

            const defaultBalance = selectedPlan === 'premium' ? 1000 : 500;
            const fullProfile = {
              id: authData.user.id,
              name: formData.name,
              email: formData.email.toLowerCase().trim(),
              plan: selectedPlan,
              balance: defaultBalance,
              paid: true,
              status: 'active',
              joined: 'Today',
              total_referrals: 0,
              referral_earnings: 0
            };

            const { error: profileError } = await db.from('profiles').insert([fullProfile]);
            if (profileError) throw profileError;

            // ── REFERRAL HOOK ──
            const activeRefCode = localStorage.getItem('9ja_active_ref_code');
            if (activeRefCode) {
              const parts = activeRefCode.split('-');
              const snippet = parts[parts.length - 1];
              const { data: allProfiles, error: fetchErr } = await db.from('profiles').select('*');
              if (!fetchErr && allProfiles) {
                const parent = allProfiles.find(p => p.id && p.id.toString().slice(-4) === snippet);
                if (parent) {
                  const commission = parent.plan === 'premium' ? 1000 : 500;
                  await db.from('profiles').update({
                    balance: (parent.balance || 0) + commission,
                    total_referrals: (parent.total_referrals || 0) + 1,
                    referral_earnings: (parent.referral_earnings || 0) + commission
                  }).eq('id', parent.id);
                  const parentLocal = store.get(STORAGE_KEYS.userProfile(parent.email));
                  if (parentLocal) {
                    store.set(STORAGE_KEYS.userProfile(parent.email), {
                      ...parentLocal,
                      balance: (parent.balance || 0) + commission,
                      total_referrals: (parent.total_referrals || 0) + 1,
                      referral_earnings: (parent.referral_earnings || 0) + commission
                    });
                  }
                  const reg = store.get(STORAGE_KEYS.USERS_REGISTRY, []);
                  const rIdx = reg.findIndex(u => u.email === parent.email);
                  if (rIdx !== -1) { reg[rIdx].balance = (parent.balance || 0) + commission; reg[rIdx].refs = (parent.total_referrals || 0) + 1; store.set(STORAGE_KEYS.USERS_REGISTRY, reg); }
                  localStorage.removeItem('9ja_active_ref_code');
                }
              }
            }

            store.set(STORAGE_KEYS.userProfile(formData.email), fullProfile);
            const registry = store.get(STORAGE_KEYS.USERS_REGISTRY, []);
            if (!registry.find(u => u.email === fullProfile.email)) {
              registry.push({ id: fullProfile.id, name: fullProfile.name, email: fullProfile.email, plan: fullProfile.plan, balance: fullProfile.balance, joined: fullProfile.joined, tasks: 0, refs: 0, status: 'active' });
              store.set(STORAGE_KEYS.USERS_REGISTRY, registry);
            }
            if (onRegisterNewUser) onRegisterNewUser({ id: fullProfile.id, name: fullProfile.name, email: fullProfile.email, plan: fullProfile.plan, balance: fullProfile.balance, joined: fullProfile.joined, tasks: 0, refs: 0, status: 'active' });

            toast.success('Welcome to 9jaWatchers! 🎉', `Your account is live, ${formData.name.split(' ')[0]}. Start earning now!`);
            onLoginSuccess(selectedPlan, fullProfile);
          } catch (err) {
            toast.error('Setup Failed', `Payment received but account setup failed: ${err.message}`);
          } finally {
            setIsProcessing(false);
          }
        },
        onCancel: () => toast.warning('Payment Cancelled', 'Your payment was not completed. Try again when ready.'),
        onError: (error) => toast.error('Payment Error', error.message || 'Something went wrong with the payment gateway.')
      });
    } catch (err) {
      toast.error('Gateway Error', 'Unable to connect to Paystack. Please try again.');
    }
  };

  return (
    <div style={{ minHeight: '100vh', background: 'var(--bg)', display: 'flex', flexDirection: 'column' }}>
      {/* Top bar */}
      <div style={{ padding: '16px 24px', borderBottom: '1px solid var(--border)', background: 'var(--surface)' }}>
        <button onClick={() => setScreen('landing')} style={{ background: 'none', border: 'none', cursor: 'pointer', display: 'flex', alignItems: 'center', gap: 6, color: 'var(--text-2)', fontSize: 14, fontWeight: 600, fontFamily: 'inherit' }}>
          ← <Logo size="sm" />
        </button>
      </div>

      <div style={{ flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 20 }}>
        <div className="fade-in" style={{ width: '100%', maxWidth: 440 }}>

          {/* Step indicators */}
          {!isLogin && (
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8, marginBottom: 28 }}>

              <div style={{ flex: 1, maxWidth: 60, height: 1, background: step >= 2 ? 'var(--green)' : 'var(--border)', transition: 'background 0.3s' }} />
              <div className={`step-dot ${step >= 2 ? 'active' : ''}`} style={{ width: step === 2 ? 20 : 8, background: step >= 2 ? 'var(--green)' : 'var(--border)', borderRadius: 99, transition: 'all 0.3s' }} />

          )}

            <div style={{ textAlign: 'center', marginBottom: 28 }}>
              <h2 style={{ fontSize: 22, fontWeight: 900, marginBottom: 6, fontFamily: "'Sora', sans-serif" }}>
                {isLogin ? 'Welcome Back' : step === 1 ? 'Create Your Account' : 'Activate Your Plan'}
              </h2>
              <p style={{ color: 'var(--text-3)', fontSize: 14 }}>
                {isLogin ? 'Sign in to your earnings dashboard' : step === 1 ? 'Join thousands of Nigerians earning daily' : 'Complete payment to start earning'}
              </p>
            </div>

            {step === 1 ? (
              <form onSubmit={handleSubmit} style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
                {!isLogin && (
                  <div>
                    <label style={{ fontSize: 12, fontWeight: 700, color: 'var(--text-2)', display: 'block', marginBottom: 6 }}>Full Name <span style={{color:'var(--red)'}}>*</span></label>
                    <input required type="text" className="input" placeholder="Same as your bank account name" value={formData.name} onChange={e => setF('name', e.target.value)} />
                  </div>
                )}
                <div>
                  <label style={{ fontSize: 12, fontWeight: 700, color: 'var(--text-2)', display: 'block', marginBottom: 6 }}>Email Address <span style={{color:'var(--red)'}}>*</span></label>
                  <input required type="email" className="input" placeholder="you@example.com" value={formData.email} onChange={e => setF('email', e.target.value)} />
                </div>
                {!isLogin && (
                  <div>
                    <label style={{ fontSize: 12, fontWeight: 700, color: 'var(--text-2)', display: 'block', marginBottom: 6 }}>Phone Number <span style={{color:'var(--red)'}}>*</span></label>
                    <input required type="tel" className="input" placeholder="08012345678" value={formData.phone} onChange={e => setF('phone', e.target.value)} />
                  </div>
                )}
                <div>
                  <label style={{ fontSize: 12, fontWeight: 700, color: 'var(--text-2)', display: 'block', marginBottom: 6 }}>Password <span style={{color:'var(--red)'}}>*</span></label>
                  <input required type="password" className="input" placeholder="At least 8 characters" value={formData.password} onChange={e => setF('password', e.target.value)} />
                </div>

                <button className="btn btn-primary btn-full btn-lg" disabled={isProcessing} type="submit" style={{ marginTop: 6 }}>
                  {isProcessing ? '⟳ Please wait…' : isLogin ? 'Sign In' : 'Continue to Payment →'}
                </button>

                <p style={{ textAlign: 'center', fontSize: 13, color: 'var(--text-3)', marginTop: 4 }}>
                  {isLogin ? "Don't have an account? " : 'Already registered? '}
                  <span style={{ color: 'var(--green)', cursor: 'pointer', fontWeight: 700 }} onClick={() => setScreen(isLogin ? 'signup' : 'login')}>
                    {isLogin ? 'Register here' : 'Sign in'}
                  </span>
                </p>
              </form>
            ) : (
              <div className="slide-down" style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
                <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
                  {[
                    { key: 'basic', label: 'Basic Plan', price: '₦4,000', desc: '8 tasks/day · ₦500 bonus' },
                    { key: 'premium', label: 'Premium Plan', price: '₦8,000', desc: '20 tasks/day · ₦1,000 bonus', highlight: true }
                  ].map(p => (
                    <div key={p.key} onClick={() => setSelectedPlan(p.key)} style={{
                      padding: '14px 16px', borderRadius: '10px', cursor: 'pointer',
                      border: `2px solid ${selectedPlan === p.key ? (p.highlight ? 'var(--purple)' : 'var(--green)') : 'var(--border)'}`,
                      background: selectedPlan === p.key ? (p.highlight ? 'var(--purple-light)' : 'var(--green-light)') : 'var(--bg)',
                      transition: 'all 0.2s',
                      display: 'flex', justifyContent: 'space-between', alignItems: 'center'
                    }}>
                      <div>
                        <div style={{ fontWeight: 800, fontSize: 14, color: 'var(--text)' }}>{p.label}</div>
                        <div style={{ fontSize: 12, color: 'var(--text-3)', marginTop: 2 }}>{p.desc}</div>
                      </div>
                      <div style={{ fontWeight: 900, fontSize: 16, color: p.highlight ? 'var(--purple)' : 'var(--green)' }}>{p.price}</div>
                    </div>
                  ))}
                </div>

                <div className="info-box" style={{ background: 'var(--green-light)', borderRadius: 'var(--radius-sm)' }}>
                  <span>🔒</span>
                  <div style={{ fontSize: 13, color: 'var(--text-2)', lineHeight: 1.5 }}>
                    Secured by <strong>Paystack</strong>. Your payment is fully encrypted and protected. Credentials are never stored by us.
                  </div>
                </div>

                <button className="btn btn-primary btn-full btn-lg" disabled={isProcessing} onClick={handlePaystack}>
                  {isProcessing ? '⟳ Processing…' : `Pay ${selectedPlan === 'premium' ? '₦8,000' : '₦4,000'} & Activate`}
                </button>
                <button className="btn btn-ghost btn-sm btn-full" onClick={() => setStep(1)}>← Go Back</button>
              </div>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

// ── USER DASHBOARD ────────────────────────────────────────────────────────
function UserDashboard({ plan, onLogout, globalTasksList, setGlobalTasksList, userBalance, setUserBalance, globalUserTasksState, setGlobalUserTasksState, setWithdrawalsList, currentUser }) {
  // Normalise tasksState keys to strings (Supabase jsonb returns string keys, JS objects use numeric)
  const normalizeTasksState = (state) => {
    if (!state || typeof state !== 'object') return {};
    const out = {};
    Object.keys(state).forEach(k => { out[String(k)] = state[k]; });
    return out;
  };

  const [page, setPage] = useState('dashboard');
  const [withdrawalSuccess, setWithdrawalSuccess] = useState(false);
  const [withdrawalForm, setWithdrawalForm] = useState({ bank: '', account: '', name: currentUser?.name || '', amount: '' });
  const [showUpgradeModal, setShowUpgradeModal] = useState(false);
  const [liveRefsCount, setLiveRefsCount] = useState(currentUser?.total_referrals || 0);
  const [liveRefsEarnings, setLiveRefsEarnings] = useState(currentUser?.referral_earnings || 0);

  const isPremium = plan === 'premium';
  const executableTasks = globalTasksList.filter(t => t.plan === 'both' || t.plan === plan);

  const [historyLog, setHistoryLog] = useState(() => {
    const saved = store.get(STORAGE_KEYS.userProfile(currentUser?.email || ''));
    return saved?.historyLog || [{ label: 'Welcome Bonus — Account Activated', amount: isPremium ? 1000 : 500, type: 'credit', timestamp: 'Account Created' }];
  });

  // ── Real-time task sync via Supabase Realtime ──
  useEffect(() => {
    // Initial fetch on mount
    const fetchTasks = async () => {
      try {
        const { data, error } = await db.from('tasks').select('*').order('id', { ascending: true });
        if (!error && data && data.length > 0) {
          setGlobalTasksList(data);
          store.set(STORAGE_KEYS.TASKS, data);
        }
      } catch(e) {}
    };
    fetchTasks();

    // Subscribe to real-time INSERT/DELETE on tasks table
    const channel = db.channel('tasks-changes')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'tasks' }, (payload) => {
        // Any change to the tasks table — re-fetch full list immediately
        fetchTasks();
      })
      .subscribe();

    return () => { db.removeChannel(channel); };
  }, []);

  useEffect(() => {
    if (!currentUser?.id || page !== 'referrals') return;
    const fetchStats = async () => {
      try {
        const { data, error } = await db.from('profiles').select('total_referrals, referral_earnings, balance').eq('id', currentUser.id).single();
        if (!error && data) { setLiveRefsCount(data.total_referrals || 0); setLiveRefsEarnings(data.referral_earnings || 0); setUserBalance(data.balance); }
      } catch (e) { console.error(e); }
    };
    fetchStats();
  }, [page, currentUser?.id]);

  const profileRefCode = `9JW-${isPremium ? 'PREM' : 'BASC'}-${currentUser?.id?.toString().slice(-4) || '2026'}`;
  const profileRefLink = `https://9jawatchers.com/?ref=${profileRefCode}`;
  const completedCount = executableTasks.filter(t => globalUserTasksState[t.id] || globalUserTasksState[String(t.id)]).length;
  const earningsToday = executableTasks.filter(t => globalUserTasksState[t.id] || globalUserTasksState[String(t.id)]).reduce((s, t) => s + t.reward, 0);

  useEffect(() => {
    if (!currentUser?.email) return;
    const saved = store.get(STORAGE_KEYS.userProfile(currentUser.email)) || {};
    store.set(STORAGE_KEYS.userProfile(currentUser.email), { ...saved, balance: userBalance, tasksState: globalUserTasksState, historyLog, total_referrals: liveRefsCount, referral_earnings: liveRefsEarnings });
    const registry = store.get(STORAGE_KEYS.USERS_REGISTRY, []);
    const idx = registry.findIndex(u => u.email === currentUser.email);
    if (idx !== -1) { registry[idx] = { ...registry[idx], balance: userBalance, tasks: completedCount, refs: liveRefsCount }; store.set(STORAGE_KEYS.USERS_REGISTRY, registry); }
  }, [userBalance, globalUserTasksState, historyLog, liveRefsCount, liveRefsEarnings]);

  const handleTaskComplete = async (taskId, reward) => {
    const newBal = userBalance + reward;
    const newTasksState = { ...globalUserTasksState, [String(taskId)]: true };
    setGlobalUserTasksState(newTasksState);
    setUserBalance(newBal);
    const t = executableTasks.find(t => t.id === taskId);
    setHistoryLog(prev => [{ label: `Task: ${t?.title?.substring(0, 40) || 'Task'}`, amount: reward, type: 'credit', timestamp: 'Just Now' }, ...prev]);
    // Save both balance AND tasksState to Supabase so refreshes and other devices stay in sync
    if (currentUser?.id) {
      try {
        await db.from('profiles').update({ balance: newBal, tasks_state: newTasksState }).eq('id', currentUser.id);
      } catch (e) { console.error(e); }
    }
    // Also persist to localStorage as fallback
    const saved = store.get(STORAGE_KEYS.userProfile(currentUser?.email || '')) || {};
    store.set(STORAGE_KEYS.userProfile(currentUser?.email || ''), { ...saved, balance: newBal, tasksState: newTasksState });
  };

  const submitWithdrawal = async (e) => {
    e.preventDefault();
    const amount = Number(withdrawalForm.amount);
    if (amount < 2000) { toast.error('Minimum Amount', 'Minimum withdrawal is ₦2,000.'); return; }
    if (amount > userBalance) { toast.error('Insufficient Balance', `Your balance is ${naira(userBalance)}.`); return; }

    const newBal = userBalance - amount;
    setUserBalance(newBal);
    const req = { user: currentUser?.name || 'Unknown', email: currentUser?.email || '', plan, bank: withdrawalForm.bank, account: withdrawalForm.account, accountName: withdrawalForm.name, amount, status: 'pending', date: new Date().toLocaleDateString('en-NG', { day: '2-digit', month: 'short', year: 'numeric' }) };
    // Save to Supabase — triggers Realtime push to admin instantly
    try {
      const { data: inserted, error } = await db.from('withdrawals').insert([req]).select().single();
      if (error) throw error;
      const saved = inserted || { ...req, id: Date.now() };
      setWithdrawalsList(prev => [saved, ...prev]);
      store.set(STORAGE_KEYS.WITHDRAWALS, [saved]);
    } catch(e) {
      // Fallback: save locally if Supabase fails
      const fallback = { ...req, id: Date.now() };
      setWithdrawalsList(prev => { const u = [fallback, ...prev]; store.set(STORAGE_KEYS.WITHDRAWALS, u); return u; });
      toast.warning('Sync Warning', 'Request saved locally — may not reflect on admin until reconnected.');
    }
    if (currentUser?.id) {
      try { await db.from('profiles').update({ balance: newBal }).eq('id', currentUser.id); } catch (e) { console.error(e); }
    }
    setWithdrawalSuccess(true);
    toast.success('Withdrawal Requested', `${naira(amount)} withdrawal is pending admin approval.`);
  };

  const navItems = [
    { id: 'dashboard', icon: '🏠', label: 'Dashboard' },
    { id: 'withdraw',  icon: '💳', label: 'Withdraw Funds' },
    { id: 'referrals', icon: '👥', label: 'Referrals' },
    { id: 'history',   icon: '📜', label: 'History' },
  ];

  return (
    <div className="app-shell">
      <Sidebar
        items={navItems} active={page} setPage={setPage}
        plan={plan} onLogout={onLogout}
        onUpgrade={() => setShowUpgradeModal(true)}
        currentUser={currentUser} balance={userBalance}
      />

      {showUpgradeModal && (
        <div className="modal-overlay" onClick={() => setShowUpgradeModal(false)}>
          <div className="modal-box" onClick={e => e.stopPropagation()}>
            <div style={{ textAlign: 'center', marginBottom: 20 }}>
              <div style={{ fontSize: 40, marginBottom: 12 }}>⭐</div>
              <h3 style={{ fontSize: 20, fontWeight: 900, marginBottom: 8 }}>Upgrade to Premium</h3>
              <p style={{ color: 'var(--text-2)', fontSize: 14, lineHeight: 1.6 }}>
                Unlock 20 high-yield tasks daily, ₦1,000 welcome bonus, and priority withdrawals.
              </p>
            </div>
            <button className="btn btn-gold btn-full" onClick={() => {
              if (typeof window.PaystackPop === 'undefined') { toast.error('Payment Error', 'Paystack failed to load. Please refresh.'); return; }
              const paystack = new window.PaystackPop();
              paystack.newTransaction({
                key: 'pk_live_56cd68f5adb0e165c34545bee318900fcd3505e3',
                email: currentUser?.email || '',
                amount: 8000 * 100,
                currency: 'NGN',
                metadata: { custom_fields: [{ display_name: 'Full Name', variable_name: 'customer_name', value: currentUser?.name || '' }, { display_name: 'Plan', variable_name: 'plan', value: 'premium' }] },
                onSuccess: async (transaction) => {
                  setShowUpgradeModal(false);
                  toast.info('Payment Received', 'Upgrading your account…');
                  try {
                    await db.from('profiles').update({ plan: 'premium', balance: (userBalance || 0) + 1000 }).eq('id', currentUser.id);
                    const sp = store.get(STORAGE_KEYS.userProfile(currentUser?.email || '')) || {};
                    store.set(STORAGE_KEYS.userProfile(currentUser?.email || ''), { ...sp, plan: 'premium', balance: (userBalance || 0) + 1000 });
                    setUserBalance(prev => prev + 1000);
                    toast.success('Upgrade Successful! 🎉', 'You are now on Premium!');
                    setTimeout(() => window.location.reload(), 2000);
                  } catch (err) { toast.error('Upgrade Error', err.message); }
                },
                onCancel: () => toast.warning('Cancelled', 'Upgrade payment was not completed.'),
                onError: (err) => toast.error('Payment Error', err.message || 'Something went wrong.')
              });
            }}>Pay ₦8,000 to Upgrade</button>
            <button className="btn btn-ghost btn-sm btn-full" style={{ marginTop: 8 }} onClick={() => setShowUpgradeModal(false)}>Maybe Later</button>
          </div>
        </div>
      )}

      <div className="main-scroll">
        <div className="main-content" style={{ padding: '32px 36px', maxWidth: 900, margin: '0 auto' }}>

          {page === 'dashboard' && (
            <div className="fade-in">
              <div style={{ marginBottom: 28 }}>
                <h1 style={{ fontSize: 26, fontWeight: 900, marginBottom: 4, fontFamily: "'Sora', sans-serif" }}>
                  Hey, {currentUser?.name?.split(' ')[0] || 'Earner'} 👋
                </h1>
                <p style={{ color: 'var(--text-3)', fontSize: 14 }}>Here's your earning overview for today.</p>
              </div>

              <div className="stats-row" style={{ display: 'flex', gap: 16, marginBottom: 28, flexWrap: 'wrap' }}>
                <StatCard label="Available Balance" value={naira(userBalance)} icon="💰" accent="gold" />
                <StatCard label="Earned Today" value={naira(earningsToday)} icon="📈" accent="green" />
                <StatCard label="Tasks Done" value={`${completedCount}/${executableTasks.length}`} icon="⚡" accent="blue" />
              </div>

              <div className="card" style={{ marginBottom: 28 }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 12 }}>
                  <span style={{ fontWeight: 700, fontSize: 14 }}>Daily Progress</span>
                  <span style={{ fontWeight: 800, color: 'var(--green)', fontSize: 14 }}>{Math.round((completedCount / (executableTasks.length || 1)) * 100)}%</span>
                </div>
                <div className="progress-track">
                  <div className="progress-fill" style={{ width: `${(completedCount / (executableTasks.length || 1)) * 100}%`, background: 'var(--green)' }} />
                </div>
                <div style={{ display: 'flex', justifyContent: 'space-between', marginTop: 8, fontSize: 12, color: 'var(--text-3)', fontWeight: 600 }}>
                  <span>{completedCount} completed</span>
                  <span>{executableTasks.length - completedCount} remaining</span>
                </div>
              </div>

              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 14 }}>
                <h2 style={{ fontSize: 17, fontWeight: 800 }}>Available Tasks</h2>
                <Badge color={isPremium ? 'purple' : 'green'}>{isPremium ? 'Premium' : 'Basic'} Plan</Badge>
              </div>
              <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
                {executableTasks.length === 0 ? (
                  <div className="card" style={{ textAlign: 'center', padding: 40, color: 'var(--text-3)' }}>No tasks available right now. Check back soon!</div>
                ) : executableTasks.map(task => (
                  <TaskCard key={task.id} task={task} onComplete={handleTaskComplete} globalUserTasksState={globalUserTasksState} />
                ))}
              </div>
            </div>
          )}

          {page === 'withdraw' && (
            <div className="fade-in">
              <div style={{ marginBottom: 28 }}>
                <h1 style={{ fontSize: 24, fontWeight: 900, marginBottom: 4, fontFamily: "'Sora', sans-serif" }}>Withdraw Funds</h1>
                <p style={{ color: 'var(--text-3)', fontSize: 14 }}>Request a withdrawal to your Nigerian bank account.</p>
              </div>

              {withdrawalSuccess ? (
                <div className="card" style={{ textAlign: 'center', padding: '48px 32px' }}>
                  <div style={{ width: 64, height: 64, borderRadius: '50%', background: 'var(--green-light)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 28, margin: '0 auto 16px' }}>✓</div>
                  <h3 style={{ fontSize: 20, fontWeight: 900, marginBottom: 8 }}>Withdrawal Submitted!</h3>
                  <p style={{ color: 'var(--text-2)', fontSize: 14, marginBottom: 24, lineHeight: 1.6 }}>Your request is pending admin approval. Funds are typically released within 24 hours.</p>
                  <button className="btn btn-primary" onClick={() => { setWithdrawalSuccess(false); setWithdrawalForm({ bank: '', account: '', name: currentUser?.name || '', amount: '' }); }}>
                    New Withdrawal Request
                  </button>
                </div>
              ) : (
                <div className="withdraw-layout" style={{ display: 'flex', gap: 24, flexWrap: 'wrap', alignItems: 'flex-start' }}>
                  <form onSubmit={submitWithdrawal} className="card" style={{ flex: 2, minWidth: 300 }}>

                      <span style={{ fontSize: 14, color: 'var(--text-2)', fontWeight: 600 }}>Available Balance</span>
                      <span style={{ fontWeight: 900, fontSize: 20, color: 'var(--gold)' }}>{naira(userBalance)}</span>
                    </div>
                    <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
                      <div>
                        <label style={{ fontSize: 12, fontWeight: 700, color: 'var(--text-2)', display: 'block', marginBottom: 6 }}>Bank Name</label>
                        <select required className="input" value={withdrawalForm.bank} onChange={e => setWithdrawalForm(p => ({...p, bank: e.target.value}))}>
                          <option value="">Select your bank</option>
                          {['GTBank','Zenith Bank','Access Bank','UBA','First Bank','Kuda Bank','Opay','PalmPay','Moniepoint','Wema Bank'].map(b => <option key={b} value={b}>{b}</option>)}
                        </select>
                      </div>
                      <div>
                        <label style={{ fontSize: 12, fontWeight: 700, color: 'var(--text-2)', display: 'block', marginBottom: 6 }}>Account Number (10 digits)</label>
                        <input required type="text" maxLength={10} pattern="\d{10}" className="input" placeholder="0123456789" value={withdrawalForm.account} onChange={e => setWithdrawalForm(p => ({...p, account: e.target.value}))} />
                      </div>
                      <div>
                        <label style={{ fontSize: 12, fontWeight: 700, color: 'var(--text-2)', display: 'block', marginBottom: 6 }}>Account Name</label>
                        <input required type="text" className="input" placeholder="Name as on your bank account" value={withdrawalForm.name} onChange={e => setWithdrawalForm(p => ({...p, name: e.target.value}))} />
                      </div>
                      <div>
                        <label style={{ fontSize: 12, fontWeight: 700, color: 'var(--text-2)', display: 'block', marginBottom: 6 }}>Amount (₦)</label>
                        <input required type="number" min={2000} max={userBalance} className="input" placeholder="Minimum ₦2,000" value={withdrawalForm.amount} onChange={e => setWithdrawalForm(p => ({...p, amount: e.target.value}))} />
                      </div>
                      <button className="btn btn-primary btn-full" type="submit" disabled={userBalance < 2000} style={{ marginTop: 6 }}>
                        {userBalance < 2000 ? `Need ₦${(2000 - userBalance).toLocaleString()} more to withdraw` : 'Submit Withdrawal Request'}
                      </button>
                    </div>
                  </form>

                  <div style={{ flex: 1, minWidth: 220, display: 'flex', flexDirection: 'column', gap: 12 }}>
                    <div className="card" style={{ background: 'var(--green-light)', border: '1px solid #86efac' }}>
                      <h4 style={{ fontWeight: 800, fontSize: 13, marginBottom: 12, color: 'var(--green)', textTransform: 'uppercase', letterSpacing: '0.05em' }}>Withdrawal Rules</h4>
                      <div className="withdraw-info-row"><span>Minimum</span><strong>₦2,000</strong></div>
                      <div className="withdraw-info-row"><span>Processing Time</span><strong>≤ 24 hours</strong></div>
                      <div className="withdraw-info-row"><span>Payment Method</span><strong>Paystack Direct</strong></div>
                      <div className="withdraw-info-row"><span>Transaction Fee</span><strong style={{color:'var(--green)'}}>₦0.00</strong></div>
                    </div>
                  </div>
                </div>
              )}
            </div>
          )}

          {page === 'referrals' && (
            <div className="fade-in">
              <div style={{ marginBottom: 28 }}>
                <h1 style={{ fontSize: 24, fontWeight: 900, marginBottom: 4, fontFamily: "'Sora', sans-serif" }}>Referral Earnings</h1>
                <p style={{ color: 'var(--text-3)', fontSize: 14 }}>Share your link — earn {isPremium ? '₦1,000' : '₦500'} for every person who registers.</p>

              <div className="card" style={{ marginBottom: 20 }}>

                  <input readOnly type="text" className="input" value={profileRefLink} style={{ fontWeight: 600, fontSize: 13, color: 'var(--green)' }} />

                  }}>Copy</button>
                </div>
              </div>

              <div className="stats-row" style={{ display: 'flex', gap: 16, flexWrap: 'wrap', marginBottom: 20 }}>
                <StatCard label="Total Referrals" value={`${liveRefsCount} users`} icon="👥" accent="blue" />
                <StatCard label="Referral Earnings" value={naira(liveRefsEarnings)} icon="💰" accent="gold" />
                <StatCard label="Per Referral" value={isPremium ? '₦1,000' : '₦500'} icon="🎯" accent="green" />

// ── ADMIN DASHBOARD ───────────────────────────────────────────────────────
function AdminDashboard({ onLogout, globalTasksList, setGlobalTasksList, userManagementRows, setUserManagementRows, withdrawalsList, setWithdrawalsList }) {
  const [page, setPage] = useState('overview');
  const [taskForm, setTaskForm] = useState({ type: 'video', title: '', url: '', reward: '', plan: 'both' });
  const [taskSaved, setTaskSaved] = useState(false);
  const [confirmModal, setConfirmModal] = useState({ open: false });

  const pendingReqs = withdrawalsList.filter(w => w.status === 'pending');
  const totalPaid   = withdrawalsList.filter(w => w.status === 'approved').reduce((s, w) => s + w.amount, 0);

  const approveWithdrawal = (id) => {
    setWithdrawalsList(prev => { const u = prev.map(w => w.id === id ? { ...w, status: 'approved' } : w); store.set(STORAGE_KEYS.WITHDRAWALS, u); return u; });
    db.from('withdrawals').update({ status: 'approved' }).eq('id', id).then(({ error }) => {
      if (error) console.warn('Approval sync failed:', error.message);
    });
    toast.success('Withdrawal Approved', 'The payout has been approved and will be processed.');
  };
  const rejectWithdrawal = (id) => {
    setWithdrawalsList(prev => { const u = prev.map(w => w.id === id ? { ...w, status: 'rejected' } : w); store.set(STORAGE_KEYS.WITHDRAWALS, u); return u; });
    db.from('withdrawals').update({ status: 'rejected' }).eq('id', id).then(({ error }) => {
      if (error) console.warn('Rejection sync failed:', error.message);
    });
    toast.warning('Withdrawal Rejected', 'The withdrawal request has been declined.');
  };
  const removeTask = (id) => {
    setGlobalTasksList(prev => { const u = prev.filter(t => t.id !== id); store.set(STORAGE_KEYS.TASKS, u); return u; });
    // Also delete from Supabase so other devices reflect removal instantly
    db.from('tasks').delete().eq('id', id).then(({ error }) => {
      if (error) console.warn('Task delete from Supabase failed:', error.message);
    });
    toast.info('Task Removed', 'The task has been removed from the platform.');
  };
  const toggleSuspend = (id, currentStatus) => {
    setUserManagementRows(prev => { const u = prev.map(u => u.id === id ? { ...u, status: u.status === 'active' ? 'suspended' : 'active' } : u); store.set(STORAGE_KEYS.USERS_REGISTRY, u); return u; });

  };

  const submitTask = (e) => {
    e.preventDefault();
    if (!taskForm.title || !taskForm.url || !taskForm.reward) return;
    const newTask = { id: Date.now(), type: taskForm.type, title: taskForm.title, url: taskForm.url, reward: Number(taskForm.reward), plan: taskForm.plan };
    // Save to localStorage immediately for same-device users
    setGlobalTasksList(prev => { const u = [...prev, newTask]; store.set(STORAGE_KEYS.TASKS, u); return u; });
    // Save to Supabase — triggers Realtime push to ALL connected devices instantly
    db.from('tasks').insert([newTask]).then(({ error }) => {

    });
    setTaskForm({ type: 'video', title: '', url: '', reward: '', plan: 'both' });

// ── APP SHELL ─────────────────────────────────────────────────────────────
function App() {
  // ── ALL STATE FIRST ──
  const [screen, setScreen] = useState('landing');
  const [planOverride, setPlanOverride] = useState(null);
  const [roleContext, setRoleContext] = useState(null);
  const [currentUser, setCurrentUser] = useState(null);
  const [globalTasksList, setGlobalTasksList] = useState(() => store.get(STORAGE_KEYS.TASKS) || INITIAL_TASKS);
  const [userManagementRows, setUserManagementRows] = useState(() => {
    const saved = store.get(STORAGE_KEYS.USERS_REGISTRY, []);
    const emails = new Set(saved.map(u => u.email));
    return [...saved, ...INITIAL_USERS.filter(u => !emails.has(u.email))];
  });
  const [withdrawalsList, setWithdrawalsList] = useState([]);
  const [userBalance, setUserBalance] = useState(500);
  const [globalUserTasksState, setGlobalUserTasksState] = useState({});

  // ── EFFECTS (all after state) ──
  useEffect(() => {
    const init = async () => {
    const params = new URLSearchParams(window.location.search);
    const ref = params.get('ref');
    if (ref) { localStorage.setItem('9ja_active_ref_code', ref.trim()); }
    // Load withdrawals from Supabase on mount
    try {
      const { data: wdData } = await db.from('withdrawals').select('*').order('id', { ascending: false });
      if (wdData && Array.isArray(wdData)) setWithdrawalsList(wdData);
    } catch(e) {
      const local = store.get(STORAGE_KEYS.WITHDRAWALS);
      if (local && Array.isArray(local)) setWithdrawalsList(local);
    }

    // Restore session on refresh
    const session = store.get(STORAGE_KEYS.SESSION);
    if (session && session.role && session.user) {
      setRoleContext(session.role);
      setCurrentUser(session.user);
      setScreen('portal');
      if (session.role !== 'admin') {
        // Fetch fresh balance from Supabase so cross-device changes show correctly
        try {
          const { data } = await db.from('profiles').select('balance, tasks_state').eq('id', session.user.id).single();
          if (data) {
            if (data.balance !== undefined) setUserBalance(data.balance);
            if (data.tasks_state) {
              const norm = {};
              Object.keys(data.tasks_state).forEach(k => { norm[String(k)] = data.tasks_state[k]; });
              setGlobalUserTasksState(norm);
            } else {
              const saved = store.get(STORAGE_KEYS.userProfile(session.user.email));
              if (saved && saved.tasksState) setGlobalUserTasksState(saved.tasksState);
            }
          } else {
            const saved = store.get(STORAGE_KEYS.userProfile(session.user.email));
            if (saved && saved.balance !== undefined) setUserBalance(saved.balance);
            if (saved && saved.tasksState) setGlobalUserTasksState(saved.tasksState);
          }
        } catch(e) {
          const saved = store.get(STORAGE_KEYS.userProfile(session.user.email));
          if (saved && saved.balance !== undefined) setUserBalance(saved.balance);
          if (saved && saved.tasksState) setGlobalUserTasksState(saved.tasksState);
        }
      }
    }
    };
    init();
  }, []);

  // Sync tasks across tabs (same device)
  useEffect(() => {
    const onTaskStorage = (e) => {
      if (e.key === STORAGE_KEYS.TASKS && e.newValue) {
        try { const u = JSON.parse(e.newValue); if (Array.isArray(u)) setGlobalTasksList(u); } catch {}
      }
    };
    window.addEventListener('storage', onTaskStorage);
    return () => window.removeEventListener('storage', onTaskStorage);
  }, []);

  // ── Cross-device sync: re-fetch balance + tasks from Supabase when window regains focus ──
  useEffect(() => {
    const onFocus = async () => {
      // Refresh tasks from localStorage (admin may have added via another device via Supabase)
      const freshTasks = store.get(STORAGE_KEYS.TASKS);
      if (freshTasks && Array.isArray(freshTasks)) setGlobalTasksList(freshTasks);

      // Refresh user balance from Supabase
      const session = store.get(STORAGE_KEYS.SESSION);
      if (session && session.user && session.role !== 'admin') {
        try {
          const { data } = await db.from('profiles').select('balance, tasks_state').eq('id', session.user.id).single();
          if (data) {
            if (data.balance !== undefined) setUserBalance(data.balance);
            if (data.tasks_state) {
              const norm = {};
              Object.keys(data.tasks_state).forEach(k => { norm[String(k)] = data.tasks_state[k]; });
              setGlobalUserTasksState(norm);
              const saved = store.get(STORAGE_KEYS.userProfile(session.user.email)) || {};
              store.set(STORAGE_KEYS.userProfile(session.user.email), { ...saved, balance: data.balance, tasksState: norm });
            }
          }
        } catch(e) { /* silent fail — keep current value */ }
      }
    };
    window.addEventListener('focus', onFocus);
    return () => window.removeEventListener('focus', onFocus);
  }, []);

  // Sync withdrawals: localStorage (same device) + Supabase Realtime (cross-device)
  useEffect(() => {
    // Same-device sync via storage event
    const onWdStorage = (e) => {
      if (e.key === STORAGE_KEYS.WITHDRAWALS && e.newValue) {
        try { const u = JSON.parse(e.newValue); if (Array.isArray(u)) setWithdrawalsList(u); } catch {}
      }
    };
    window.addEventListener('storage', onWdStorage);

    // Cross-device sync via Supabase Realtime
    const fetchWithdrawals = async () => {
      try {
        const { data } = await db.from('withdrawals').select('*').order('id', { ascending: false });
        if (data && Array.isArray(data)) setWithdrawalsList(data);
      } catch(e) {}
    };
    const wdChannel = db.channel('withdrawals-changes')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'withdrawals' }, () => {
        fetchWithdrawals();
      })
      .subscribe();

    return () => {
      window.removeEventListener('storage', onWdStorage);
      db.removeChannel(wdChannel);
    };
  }, []);

  const handleLogin = async (role, profile) => {
    setRoleContext(role);
    setCurrentUser(profile);
    if (role !== 'admin') {
      // Always fetch fresh balance + tasksState from Supabase so cross-device state is correct
      let balance = profile.balance || (role === 'premium' ? 1000 : 500);
      let tasksState = {};
      try {
        const { data } = await db.from('profiles').select('balance, tasks_state').eq('id', profile.id).single();
        if (data) {
          if (data.balance !== undefined) balance = data.balance;
          if (data.tasks_state) {
            // Normalise keys — Supabase jsonb stores keys as strings
            const raw = data.tasks_state;
            Object.keys(raw).forEach(k => { tasksState[String(k)] = raw[k]; });
          }
        }
      } catch(e) {
        const saved = store.get(STORAGE_KEYS.userProfile(profile.email));
        if (saved && saved.balance !== undefined) balance = saved.balance;
        if (saved && saved.tasksState) tasksState = saved.tasksState;
      }
      setUserBalance(balance);
      setGlobalUserTasksState(tasksState);
    }
    store.set(STORAGE_KEYS.SESSION, { role, user: profile });
    setScreen('portal');
  };

  const handleLogout = () => {
    store.set(STORAGE_KEYS.SESSION, null);
    setScreen('landing');
    setRoleContext(null);
    setCurrentUser(null);
  };

  const handleNewUser = (user) => {
    setUserManagementRows(prev => { const u = [...prev, user]; store.set(STORAGE_KEYS.USERS_REGISTRY, u); return u; });
  };

  return (
    <div>
      <ToastContainer />
      {screen === 'landing' && <LandingPage setScreen={setScreen} setPlanSelection={setPlanOverride} />}
      {screen === 'login'   && <AuthPage mode="login"  setScreen={setScreen} onLoginSuccess={handleLogin} />}
      {screen === 'signup'  && <AuthPage mode="signup" setScreen={setScreen} onLoginSuccess={handleLogin} initialSelectedPlan={planOverride} onRegisterNewUser={handleNewUser} />}
      {screen === 'portal'  && (
        roleContext === 'admin' ? (
          <AdminDashboard
            onLogout={handleLogout}
            globalTasksList={globalTasksList} setGlobalTasksList={setGlobalTasksList}
            userManagementRows={userManagementRows} setUserManagementRows={setUserManagementRows}
            withdrawalsList={withdrawalsList} setWithdrawalsList={setWithdrawalsList}
          />
        ) : (
          <UserDashboard
            plan={roleContext}
            onLogout={handleLogout}
            globalTasksList={globalTasksList} setGlobalTasksList={setGlobalTasksList}
            userBalance={userBalance} setUserBalance={setUserBalance}
            globalUserTasksState={globalUserTasksState} setGlobalUserTasksState={setGlobalUserTasksState}
            setWithdrawalsList={setWithdrawalsList}
            currentUser={currentUser}
          />
        )
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
