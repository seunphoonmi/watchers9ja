// ─── TASK CARD ENGINE ────────────────────────────────────────────────────────
function TaskCard({ task, onComplete, globalUserTasksState }) {
  const isInitiallyDone = globalUserTasksState?.[task.id] || false;
  const [state, setState] = useState(isInitiallyDone ? 'done' : 'idle');
  const [secs, setSecs] = useState(50);
  const timerRef = useRef(null);

  useEffect(() => {
    if (globalUserTasksState?.[task.id]) setState('done');
  }, [globalUserTasksState, task.id]);

  const startTask = () => {
    window.open(task.url, '_blank');
    setState('counting');
    let currentSecs = 50;
    timerRef.current = setInterval(() => {
      currentSecs--;
      setSecs(currentSecs);
      if (currentSecs <= 0) {
        clearInterval(timerRef.current);
        setState('done');
        onComplete(task.id, task.reward);
      }
    }, 1000);
  };

  useEffect(() => () => clearInterval(timerRef.current), []);

  const themeColor = TASK_COLOR[task.type] || '#22c55e';
  const isCompleted = state === 'done';

  return (
    <div className="fade-in" style={{
      background: 'var(--bg-card)', borderRadius: 14,
      border: `1px solid ${isCompleted ? '#22c55e44' : 'var(--border-color)'}`,
      borderLeft: `4px solid ${isCompleted ? '#22c55e' : themeColor}`,
      padding: '16px 18px', display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 14,

        <div style={{ fontSize: 22 }}>{TASK_ICON[task.type]}</div>
        <div style={{ minWidth: 0 }}>
          <div style={{ fontWeight: 700, fontSize: 14, marginBottom: 4, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{task.title}</div>
          <div style={{ display: 'flex', gap: 6 }}>
            <Badge color={themeColor}>{task.type}</Badge>
            <Badge color="#f59e0b">+{naira(task.reward)}</Badge>
          </div>
        </div>
      </div>
      <div>
        {isCompleted ? (
          <span style={{ color: '#22c55e', fontWeight: 700, fontSize: 14 }}>✓ Credited</span>
        ) : state === 'idle' ? (
          <Btn size="sm" onClick={startTask}>Start</Btn>
        ) : (
          <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 4 }}>
            <div className="timer-circle" style={{ background: '#f59e0b11', border: '2px solid #f59e0b' }}>
              <span style={{ color: '#f59e0b', fontWeight: 900, fontSize: 16 }}>{secs}s</span>
            </div>
            <div style={{ width: 60, height: 4, background: '#1a2e1a', borderRadius: 4, overflow: 'hidden' }}>
              <div className="progress-bar" style={{ width: `${((50 - secs) / 50) * 100}%`, height: '100%', background: '#f59e0b' }} />
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

        if (profileErr || !profile) {
          alert("Profile synchronization record mismatch.");
          return;
        }

        if (!profile.paid) {
          alert("Access Denied: Account registration detected but activation payment is missing.");
          return;
        }

        alert("Access Authenticated securely across cloud servers!");
        onLoginSuccess(profile.plan);
      } else {
        // ─── CLOUD SIGNUP INITIAL ENTRY ───
        // Slide standard signup users right over to the Paystack modal window setup view
        setStep(2);
      }
    } catch (err) {
      alert(`Authentication Error: ${err.message || err}`);
    } finally {
      setIsProcessing(false);
    }
  };

  const handlePaystackExecute = () => {
    const exactAmountInKobo = (selectedPlan === 'premium' ? 8000 : 4000) * 100;
    
    try {
      const paystack = new PaystackPop();
      paystack.newTransaction({
        key: 'pk_live_56cd68f5adb0e165c34545bee318900fcd3505e3',
        email: formData.email,
        amount: exactAmountInKobo,
        currency: 'NGN',
        metadata: {
          custom_fields: [
            { display_name: "Full Name", variable_name: "customer_name", value: formData.name },
            { display_name: "Plan Target", variable_name: "plan_target", value: selectedPlan }
          ]
        },
       onSuccess: async (transaction) => {
          alert(`Clearance Successful! Reference: ${transaction.reference}`);
          setIsProcessing(true);

          try {
            // 1. Provision user identity inside Supabase Central Authentication engine
            const { data: authData, error: authError } = await supabase.auth.signUp({
              email: formData.email.toLowerCase(),
              password: formData.password,
            });

            if (authError) throw authError;

            // 2. Generate their real-time profile row entry inside our SQL table
            const defaultStartingBalance = selectedPlan === 'premium' ? 1000 : 500;
            const { error: profileError } = await supabase
              .from('profiles')
              .insert([
                {
                  id: authData.user.id,
                  name: formData.name,
                  email: formData.email.toLowerCase(),
                  plan: selectedPlan,
                  balance: defaultStartingBalance,
                  paid: true,
                  status: 'active'
                }
              ]);

            if (profileError) throw profileError;

            alert("Cloud database synced completely! Redirecting to workspace...");
            onLoginSuccess(selectedPlan);

          } catch (err) {
            alert(`Database synchronization failed post-payment: ${err.message}`);
          } finally {
            setIsProcessing(false);
          }
        },
          // Save individual user profile
          store.set(STORAGE_KEYS.userProfile(formData.email), fullProfile);

          // Add to global users registry (for admin dashboard)
          const registry = store.get(STORAGE_KEYS.USERS_REGISTRY, []);
          const alreadyExists = registry.find(u => u.email === fullProfile.email);
          if (!alreadyExists) {
            registry.push({
              id: fullProfile.id,
              name: fullProfile.name,
              email: fullProfile.email,
              plan: fullProfile.plan,
              balance: fullProfile.balance,
              joined: fullProfile.joined,
              tasks: 0,
              refs: 0,
              status: 'active'
            });
            store.set(STORAGE_KEYS.USERS_REGISTRY, registry);
          }

          // Notify parent App to push new user into admin state
          if (onRegisterNewUser) {
            onRegisterNewUser({
              id: fullProfile.id,
              name: fullProfile.name,
              email: fullProfile.email,
              plan: fullProfile.plan,
              balance: fullProfile.balance,
              joined: fullProfile.joined,
              tasks: 0,
              refs: 0,
              status: 'active'
            });
          }

          alert(`✅ Payment Successful!\nRef: ${transaction.reference}\n\nWelcome to 9jaWatchers, ${formData.name.split(' ')[0]}!`);
          onLoginSuccess(selectedPlan, fullProfile);
        },
        onCancel: () => {
          setErrorMsg('Payment was cancelled. Click the button to try again.');
          setStep(2);
        },
        onError: (error) => {
          setErrorMsg(`Payment error: ${error.message}`);
        }
      });
    } catch (err) {
      setErrorMsg('Failed to connect to Paystack payment gateway.');
    }
  };

  return (
    <div style={{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 20 }}>
      <div className="fade-in" style={{ width: '100%', maxWidth: 460, background: 'var(--bg-card)', border: '1px solid var(--border-color)', borderRadius: 24, padding: 40 }}>
        <div style={{ textAlign: 'center', marginBottom: 32 }}>
          <Logo />
        </div>

        {step === 1 ? (

                <input required type="text" className="withdraw-input" placeholder="e.g., Mark Ibrahim" value={formData.name} onChange={e => setFormData({...formData, name: e.target.value})} />
              </div>

            <div style={{ marginBottom: 16 }}>

              <input required type="email" className="withdraw-input" placeholder="you@example.com" value={formData.email} onChange={e => setFormData({...formData, email: e.target.value})} />

              </div>

            <div style={{ marginBottom: 20 }}>

            <div style={{ marginTop: 24, padding: '16px', background: 'linear-gradient(135deg, rgba(34, 197, 94, 0.1), rgba(245, 158, 11, 0.05))', borderRadius: 12, border: '1px solid rgba(34, 197, 94, 0.2)', textAlign: 'center' }}>

        ) : (

            <Btn full variant={selectedPlan === 'premium' ? 'purple' : 'green'} onClick={handlePaystackExecute}>

    </div>
  );
}

  const [historyLog, setHistoryLog] = useState(() => {
    // Load history from saved profile if available
    const saved = store.get(STORAGE_KEYS.userProfile(currentUser?.email || ''));
    return saved?.historyLog || [
      { label: 'Welcome Bonus — Contract Activation', amount: isPremium ? 1000 : 500, type: 'credit', timestamp: 'Activation' }
    ];
  });

  const profileRefCode = `9JW-${isPremium ? 'PREM' : 'BASC'}-${currentUser?.id?.toString().slice(-4) || '2026'}`;
  const completedCount = executableTasks.filter(t => globalUserTasksState[t.id]).length;
  const earningsAccumulatedToday = executableTasks.filter(t => globalUserTasksState[t.id]).reduce((sum, t) => sum + t.reward, 0);

  // Persist user state on changes
  useEffect(() => {
    if (!currentUser?.email) return;
    const saved = store.get(STORAGE_KEYS.userProfile(currentUser.email)) || {};
    store.set(STORAGE_KEYS.userProfile(currentUser.email), {
      ...saved,
      balance: userBalance,
      tasksState: globalUserTasksState,
      historyLog
    });

    // Update registry entry too
    const registry = store.get(STORAGE_KEYS.USERS_REGISTRY, []);
    const idx = registry.findIndex(u => u.email === currentUser.email);
    if (idx !== -1) {
      registry[idx] = { ...registry[idx], balance: userBalance, tasks: completedCount };
      store.set(STORAGE_KEYS.USERS_REGISTRY, registry);

  }, [userBalance, globalUserTasksState, historyLog]);

  const handleTaskRewardExecution = (taskId, compensation) => {
    setGlobalUserTasksState(prev => ({ ...prev, [taskId]: true }));
    setUserBalance(prev => prev + compensation);
    const resolvedTask = executableTasks.find(t => t.id === taskId);
    setHistoryLog(prev => [
      { label: `Task Completed: ${resolvedTask?.title?.substring(0, 35) || 'Task'}`, amount: compensation, type: 'credit', timestamp: 'Just Now' },

      bank: withdrawalForm.bank,
      account: withdrawalForm.account,

            <p style={{ color: 'var(--clr-muted)', fontSize: 14, textAlign: 'center', marginBottom: 24, lineHeight: 1.5 }}>

                  </span>
                </div>
              ))}
            </div>
          </div>
        )}

      </div>
    </div>
  );
}

// ─── ADMIN CONTROL WORKSPACE TERMINAL ─────────────────────────────────────────
function AdminDashboard({ onLogout, globalTasksList, setGlobalTasksList, userManagementRows, setUserManagementRows, withdrawalsList, setWithdrawalsList }) {
  const [page, setPage] = useState('overview');
  const [taskFormInput, setTaskFormInput] = useState({ type: 'video', title: '', url: '', reward: '', plan: 'both' });
  const [taskNoticeAlert, setTaskNoticeAlert] = useState(false);

  const pendingSettlementRequests = withdrawalsList.filter(w => w.status === 'pending');

  const dispatchActionApprove = (id) => {
    setWithdrawalsList(prev => {
      const updated = prev.map(w => w.id === id ? { ...w, status: 'approved' } : w);
      store.set(STORAGE_KEYS.WITHDRAWALS, updated);
      return updated;
    });
  };

  const dispatchActionReject = (id) => {
    setWithdrawalsList(prev => {
      const updated = prev.map(w => w.id === id ? { ...w, status: 'rejected' } : w);
      store.set(STORAGE_KEYS.WITHDRAWALS, updated);
      return updated;
    });
  };

  const dispatchActionRemoveTask = (id) => {
    setGlobalTasksList(prev => {
      const updated = prev.filter(t => t.id !== id);
      store.set(STORAGE_KEYS.TASKS, updated);
      return updated;
    });
  };

  const dispatchActionSuspendUser = (id) => {
    setUserManagementRows(prev => {
      const updated = prev.map(u => u.id === id ? { ...u, status: u.status === 'active' ? 'suspended' : 'active' } : u);
      store.set(STORAGE_KEYS.USERS_REGISTRY, updated);
      return updated;
    });
  };

  const executeTaskFormSubmission = (e) => {
    e.preventDefault();
    if (!taskFormInput.title || !taskFormInput.url || !taskFormInput.reward) return;

    const newTask = {
      id: Date.now(),
      type: taskFormInput.type,
      title: taskFormInput.title,
      url: taskFormInput.url,
      reward: Number(taskFormInput.reward),
      plan: taskFormInput.plan
    };

    setGlobalTasksList(prev => {
      const updated = [...prev, newTask];
      store.set(STORAGE_KEYS.TASKS, updated);
      return updated;
    });
    setTaskNoticeAlert(true);
    setTaskFormInput({ type: 'video', title: '', url: '', reward: '', plan: 'both' });
    setTimeout(() => setTaskNoticeAlert(false), 3000);
  };

  const adminNavStructure = [
    { id: 'overview', icon: '📊', label: 'Overview Matrix' },
    { id: 'tasks', icon: '📋', label: 'Task Deployment Rig' },
    { id: 'withdrawals', icon: '💳', label: 'Disbursement Queues' },
    { id: 'users', icon: '👥', label: 'User Matrix Management' }
  ];

  return (
    <div style={{ display: 'flex', height: '100vh', overflow: 'hidden' }}>
      <Sidebar items={adminNavStructure} active={page} setPage={setPage} plan="admin" onLogout={onLogout} pendingWithdrawalsCount={pendingSettlementRequests.length} currentUser={{ name: 'Administrator' }} />

      <div className="main-scroll main-content" style={{ flex: 1, padding: 40 }}>
        
        {page === 'overview' && (
          <div className="fade-in">
            <div style={{ marginBottom: 32 }}>
              <h1 style={{ fontSize: 26, fontWeight: 900, marginBottom: 6 }}>Global Strategy Control Command</h1>
              <p style={{ color: 'var(--clr-muted)', fontSize: 14 }}>Real-time micro-economic system telemetry indicators.</p>
            </div>

            <div style={{ display: 'flex', gap: 16, marginBottom: 32, flexWrap: 'wrap' }}>
              <StatCard label="Registered Profile Assets" value={String(userManagementRows.length)} icon="👥" color="var(--clr-blue)" />
              <StatCard label="Awaiting Settlement Action" value={String(pendingSettlementRequests.length)} icon="⏳" color="var(--clr-gold)" />
              <StatCard label="Live System Payouts Cleared" value={naira(withdrawalsList.filter(w => w.status === 'approved').reduce((s, w) => s + w.amount, 0))} icon="💸" color="var(--clr-green)" />
              <StatCard label="Active Production Tasks" value={String(globalTasksList.length)} icon="📋" color="var(--clr-purple)" />
            </div>

            {/* Newest registered users */}
            <div style={{ background: 'var(--bg-card)', padding: 24, borderRadius: 16, border: '1px solid var(--border-color)' }}>
              <h3 style={{ fontWeight: 800, fontSize: 16, marginBottom: 16 }}>🆕 Newly Registered Users</h3>
              {userManagementRows.slice(-5).reverse().length === 0 ? (
                <p style={{ color: 'var(--clr-muted)', fontSize: 14 }}>No registered users yet.</p>
              ) : (
                <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
                  {userManagementRows.slice(-5).reverse().map(u => (
                    <div key={u.id} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '12px 0', borderBottom: '1px solid var(--border-color)' }}>
                      <div>
                        <span style={{ fontWeight: 700 }}>{u.name}</span>
                        <span style={{ color: 'var(--clr-muted)', fontSize: 12, marginLeft: 10 }}>{u.email}</span>
                      </div>
                      <div style={{ display: 'flex', gap: 10, alignItems: 'center' }}>
                        <Badge color={u.plan === 'basic' ? 'var(--clr-green)' : 'var(--clr-purple)'}>{u.plan}</Badge>
                        <span style={{ fontSize: 12, color: 'var(--clr-muted)' }}>Joined {u.joined}</span>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>

            <div style={{ background: 'var(--bg-card)', padding: 24, borderRadius: 16, border: '1px solid var(--border-color)', marginTop: 20 }}>
              <h3 style={{ fontWeight: 800, fontSize: 16, marginBottom: 16 }}>⚠️ Pending Withdrawal Queue ({pendingSettlementRequests.length})</h3>
              {pendingSettlementRequests.length === 0 ? (
                <p style={{ color: 'var(--clr-muted)', textAlign: 'center', padding: '20px 0', fontSize: 14 }}>All pipelines clear.</p>
              ) : (
                <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
                  {pendingSettlementRequests.map(w => (
                    <div key={w.id} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', paddingBottom: 14, borderBottom: '1px solid var(--border-color)', flexWrap: 'wrap', gap: 12 }}>
                      <div>
                        <div style={{ fontWeight: 700 }}>{w.user} ({w.plan.toUpperCase()})</div>
                        <div style={{ fontSize: 12, color: 'var(--clr-muted)', marginTop: 2 }}>{w.bank} • ACC: {w.account}</div>
                      </div>
                      <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
                        <span style={{ fontWeight: 900, color: 'var(--clr-gold)' }}>{naira(w.amount)}</span>
                        <Btn size="sm" onClick={() => dispatchActionApprove(w.id)}>Clear Transfer</Btn>
                        <Btn variant="danger" size="sm" onClick={() => dispatchActionReject(w.id)}>Deny</Btn>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          </div>
        )}

        {page === 'tasks' && (
          <div className="fade-in">
            <div style={{ marginBottom: 24 }}>
              <h1 style={{ fontSize: 24, fontWeight: 900, marginBottom: 6 }}>Micro-Task Deployment Engine Rig</h1>
              <p style={{ color: 'var(--clr-muted)', fontSize: 14 }}>Inject brand monetization protocols into user contract pipelines.</p>
            </div>

            <div style={{ display: 'flex', gap: 24, flexWrap: 'wrap' }}>
              <form onSubmit={executeTaskFormSubmission} style={{ flex: 1, minWidth: 300, background: 'var(--bg-card)', padding: 24, borderRadius: 16, border: '1px solid var(--border-color)', height: 'fit-content' }}>
                <h3 style={{ fontWeight: 800, marginBottom: 16 }}>Deploy Fresh Asset Node</h3>
                
                {taskNoticeAlert && (
                  <div style={{ background: '#22c55e22', border: '1px solid var(--clr-green)', color: 'var(--clr-green)', padding: 12, borderRadius: 8, fontSize: 13, marginBottom: 16 }}>
                    ✓ Configuration compiled and deployed successfully.
                  </div>
                )}

                <div style={{ marginBottom: 12 }}>
                  <label style={{ fontSize: 12, color: 'var(--clr-muted)', display: 'block', marginBottom: 4 }}>Protocol Engine Mode</label>
                  <select className="withdraw-input" value={taskFormInput.type} onChange={e => setTaskFormInput({...taskFormInput, type: e.target.value})}>
                    <option value="video">Stream Video Advertising</option>
                    <option value="follow">Target Account Growth (Follow)</option>
                    <option value="like">Like Sentiment Verification</option>
                    <option value="comment">Feedback Audit (Comment)</option>
                  </select>
                </div>

                <div style={{ marginBottom: 12 }}>
                  <label style={{ fontSize: 12, color: 'var(--clr-muted)', display: 'block', marginBottom: 4 }}>Brand Action Title</label>
                  <input required type="text" className="withdraw-input" placeholder="e.g., Watch MTN 2026 Promo Advert" value={taskFormInput.title} onChange={e => setTaskFormInput({...taskFormInput, title: e.target.value})} />
                </div>

                <div style={{ marginBottom: 12 }}>
                  <label style={{ fontSize: 12, color: 'var(--clr-muted)', display: 'block', marginBottom: 4 }}>Destination URL</label>
                  <input required type="url" className="withdraw-input" placeholder="https://example.com" value={taskFormInput.url} onChange={e => setTaskFormInput({...taskFormInput, url: e.target.value})} />
                </div>

                <div style={{ marginBottom: 12 }}>
                  <label style={{ fontSize: 12, color: 'var(--clr-muted)', display: 'block', marginBottom: 4 }}>Reward Token (₦ Value)</label>
                  <input required type="number" className="withdraw-input" placeholder="150" value={taskFormInput.reward} onChange={e => setTaskFormInput({...taskFormInput, reward: e.target.value})} />
                </div>

                <div style={{ marginBottom: 16 }}>
                  <label style={{ fontSize: 12, color: 'var(--clr-muted)', display: 'block', marginBottom: 4 }}>Target Audience Scope</label>
                  <select className="withdraw-input" value={taskFormInput.plan} onChange={e => setTaskFormInput({...taskFormInput, plan: e.target.value})}>
                    <option value="both">Global (Basic + Premium)</option>
                    <option value="basic">Basic Only</option>
                    <option value="premium">Premium Only</option>
                  </select>
                </div>

                <Btn full type="submit">Compile & Broadcast Task</Btn>
              </form>

              <div style={{ flex: 1.5, minWidth: 300 }}>
                <h3 style={{ fontWeight: 800, marginBottom: 16 }}>Live Active System Arrays ({globalTasksList.length})</h3>
                <div style={{ display: 'flex', flexDirection: 'column', gap: 10, maxHeight: 540, overflowY: 'auto', paddingRight: 4 }}>
                  {globalTasksList.map(t => (
                    <div key={t.id} style={{ background: 'var(--bg-card)', padding: 16, borderRadius: 12, border: '1px solid var(--border-color)', display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: 12 }}>
                      <div style={{ minWidth: 0 }}>
                        <div style={{ fontWeight: 700, fontSize: 14, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{t.title}</div>
                        <div style={{ display: 'flex', gap: 6, marginTop: 6 }}>
                          <Badge color={TASK_COLOR[t.type]}>{t.type}</Badge>
                          <Badge color="var(--clr-gold)">₦{t.reward}</Badge>
                          <Badge color="var(--clr-muted)">{t.plan}</Badge>
                        </div>
                      </div>
                      <Btn variant="danger" size="sm" onClick={() => dispatchActionRemoveTask(t.id)}>Kill Node</Btn>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          </div>
        )}

        {page === 'withdrawals' && (
          <div className="fade-in">
            <h1 style={{ fontSize: 24, fontWeight: 900, marginBottom: 6 }}>Settlement Allocation Ledger Pipelines</h1>
            <p style={{ color: 'var(--clr-muted)', fontSize: 14, marginBottom: 32 }}>Approve or reject all pending withdrawal records.</p>
            
            <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
              {withdrawalsList.map(w => (
                <div key={w.id} style={{ background: 'var(--bg-card)', padding: 20, borderRadius: 14, border: '1px solid var(--border-color)', display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: 12 }}>
                  <div>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                      <span style={{ fontWeight: 700 }}>{w.user}</span>
                      <Badge color={w.plan === 'basic' ? 'var(--clr-green)' : 'var(--clr-purple)'}>{w.plan}</Badge>
                    </div>
                    <div style={{ fontSize: 12, color: 'var(--clr-muted)', marginTop: 4 }}>{w.bank} • Account: {w.account} • {w.date}</div>
                  </div>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 16 }}>
                    <span style={{ fontWeight: 900, fontSize: 18, color: 'var(--clr-gold)' }}>{naira(w.amount)}</span>
                    {w.status === 'pending' ? (
                      <div style={{ display: 'flex', gap: 8 }}>
                        <Btn size="sm" onClick={() => dispatchActionApprove(w.id)}>Approve</Btn>
                        <Btn variant="danger" size="sm" onClick={() => dispatchActionReject(w.id)}>Reject</Btn>
                      </div>
                    ) : (
                      <Badge color={w.status === 'approved' ? 'var(--clr-green)' : 'var(--clr-red)'}>
                        {w.status.toUpperCase()}
                      </Badge>
                    )}
                  </div>
                </div>
              ))}
            </div>
          </div>
        )}

        {page === 'users' && (
          <div className="fade-in">
            <h1 style={{ fontSize: 24, fontWeight: 900, marginBottom: 6 }}>Platform User Registry</h1>
            <p style={{ color: 'var(--clr-muted)', fontSize: 14, marginBottom: 32 }}>Oversee all registered user profiles, balances, and account states.</p>
            
            <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
              {userManagementRows.length === 0 ? (
                <p style={{ color: 'var(--clr-muted)', textAlign: 'center', padding: 40 }}>No users registered yet.</p>
              ) : (
                userManagementRows.map(u => (
                  <div key={u.id} style={{ background: 'var(--bg-card)', padding: 18, borderRadius: 14, border: '1px solid var(--border-color)', display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: 12 }}>
                    <div>
                      <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                        <span style={{ fontWeight: 700, color: u.status === 'suspended' ? 'var(--clr-red)' : 'var(--clr-text)' }}>{u.name}</span>
                        {u.status === 'suspended' && <Badge color="var(--clr-red)">SUSPENDED</Badge>}
                      </div>
                      <div style={{ fontSize: 12, color: 'var(--clr-muted)', marginTop: 4 }}>{u.email} • Joined {u.joined}</div>
                    </div>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 16, flexWrap: 'wrap' }}>
                      <Badge color={u.plan === 'basic' ? 'var(--clr-green)' : 'var(--clr-purple)'}>{u.plan}</Badge>
                      <span style={{ fontWeight: 700, color: 'var(--clr-gold)' }}>{naira(u.balance)}</span>
                      <span style={{ fontSize: 13, color: 'var(--clr-muted)' }}>Tasks: {u.tasks}</span>
                      <Btn variant={u.status === 'active' ? 'danger' : 'green'} size="sm" onClick={() => dispatchActionSuspendUser(u.id)}>
                        {u.status === 'active' ? 'Suspend' : 'Reinstate'}
                      </Btn>
                    </div>
                  </div>
                ))
              )}
            </div>
          </div>
        )}

      </div>
    </div>
  );
}

// ─── ROOT APP CONTROLLER ──────────────────────────────────────────────────────
function App() {
  const [screen, setScreen] = useState('landing');
  const [activeRoleContext, setActiveRoleContext] = useState(null);
  const [routingPlanOverride, setRoutingPlanOverride] = useState(null);
  const [currentUser, setCurrentUser] = useState(null);

  // Load tasks from localStorage or use initial
  const [globalTasksList, setGlobalTasksList] = useState(() => {
    return store.get(STORAGE_KEYS.TASKS) || INITIAL_TASKS;
  });

  // Load users: merge INITIAL_USERS with any saved registrations
  const [userManagementRows, setUserManagementRows] = useState(() => {
    const savedRegistry = store.get(STORAGE_KEYS.USERS_REGISTRY, []);
    // Merge: saved registry takes precedence, initial users fill the rest
    const savedEmails = new Set(savedRegistry.map(u => u.email));
    const merged = [...savedRegistry, ...INITIAL_USERS.filter(u => !savedEmails.has(u.email))];
    return merged;
  });

  // Load withdrawals from localStorage or use initial
  const [withdrawalsList, setWithdrawalsList] = useState(() => {
    return store.get(STORAGE_KEYS.WITHDRAWALS) || INITIAL_WITHDRAWALS;
  });

  // User-specific state
  const [userBalance, setUserBalance] = useState(500);
  const [globalUserTasksState, setGlobalUserTasksState] = useState({});

  // Called when any login (admin or user) succeeds
  const handlePortalLoginResolution = (resolvedRole, profile) => {
    setActiveRoleContext(resolvedRole);
    setCurrentUser(profile);

    if (resolvedRole !== 'admin') {
      // Load their saved balance and task state
      const savedProfile = store.get(STORAGE_KEYS.userProfile(profile.email));
      setUserBalance(savedProfile?.balance || profile.balance || (resolvedRole === 'premium' ? 1000 : 500));
      setGlobalUserTasksState(savedProfile?.tasksState || {});
    }
    setScreen('dashboard-portal');
  };

  // Called when a brand-new user pays and registers
  const handleRegisterNewUser = (newUserProfile) => {
    setUserManagementRows(prev => {
      const alreadyExists = prev.find(u => u.email === newUserProfile.email);
      if (alreadyExists) return prev;
      const updated = [...prev, newUserProfile];
      store.set(STORAGE_KEYS.USERS_REGISTRY, updated);
      return updated;
    });
  };

  const handlePortalLogoutSequence = () => {
    setActiveRoleContext(null);
    setCurrentUser(null);
    setGlobalUserTasksState({});
    setScreen('landing');
  };

  return (
    <div>
      {screen === 'landing' && <LandingPage setScreen={setScreen} setPlanSelection={setRoutingPlanOverride} />}
      
      {screen === 'login' && (
        <AuthPage
          mode="login"
          setScreen={setScreen}
          onLoginSuccess={handlePortalLoginResolution}
          initialSelectedPlan={routingPlanOverride}
          onRegisterNewUser={handleRegisterNewUser}
        />
      )}
      {screen === 'signup' && (
        <AuthPage
          mode="signup"
          setScreen={setScreen}
          onLoginSuccess={handlePortalLoginResolution}
          initialSelectedPlan={routingPlanOverride}
          onRegisterNewUser={handleRegisterNewUser}
        />
      )}
      
      {screen === 'dashboard-portal' && (
        activeRoleContext === 'admin' ? (
          <AdminDashboard
            onLogout={handlePortalLogoutSequence}
            globalTasksList={globalTasksList}
            setGlobalTasksList={setGlobalTasksList}
            userManagementRows={userManagementRows}
            setUserManagementRows={setUserManagementRows}
            withdrawalsList={withdrawalsList}
            setWithdrawalsList={setWithdrawalsList}
          />
        ) : (
          <UserDashboard
            plan={activeRoleContext}
            onLogout={handlePortalLogoutSequence}
            globalTasksList={globalTasksList}
            setGlobalTasksList={setGlobalTasksList}
            userBalance={userBalance}
            setUserBalance={setUserBalance}
            globalUserTasksState={globalUserTasksState}
            setGlobalUserTasksState={setGlobalUserTasksState}
            setWithdrawalsList={setWithdrawalsList}
            currentUser={currentUser}
          />
        )
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
