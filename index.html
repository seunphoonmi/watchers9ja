    .toast-icon{font-size:20px;flex-shrink:0;margin-top:1px;}.toast-body{flex:1;}
    .toast-title{font-weight:700;font-size:14px;color:var(--text);margin-bottom:2px;}
    .toast-msg{font-size:13px;color:var(--text-2);line-height:1.5;}
    .toast-close{background:none;border:none;cursor:pointer;color:var(--text-3);font-size:16px;padding:0;flex-shrink:0;}
    .toast-close:hover{color:var(--text);}
    .toast.success{border-left:4px solid var(--green);}.toast.error{border-left:4px solid var(--red);}
    .toast.warning{border-left:4px solid var(--gold);}.toast.info{border-left:4px solid var(--blue);}

let _tc = 0; const _tl = new Set();

function ToastContainer(){
  const [toasts,setToasts]=useState([]);
  useEffect(()=>{ _tl.add(setToasts); return()=>_tl.delete(setToasts); },[]);
  const dismiss=id=>{ const el=document.getElementById(`toast-${id}`); if(el)el.classList.add('exiting'); setTimeout(()=>setToasts(p=>p.filter(t=>t.id!==id)),260); };
  if(!toasts.length)return null;
  return ReactDOM.createPortal(toasts.map(t=>(
    <div key={t.id} id={`toast-${t.id}`} className={`toast ${t.type}`}>
      <span className="toast-icon">{t.icon}</span>
      <div className="toast-body"><div className="toast-title">{t.title}</div>{t.msg&&<div className="toast-msg">{t.msg}</div>}</div>
      <button className="toast-close" onClick={()=>dismiss(t.id)}>×</button>
    </div>
  )),document.getElementById('toast-root'));
}

// ── EXPORT HELPERS ─────────────────────────────────────────────────────────
const exportXLS=(data,fname,sheet='Sheet1')=>{
  if(!window.XLSX){toast.error('Export Error','XLSX library not loaded.');return;}
  const wb=window.XLSX.utils.book_new(),ws=window.XLSX.utils.json_to_sheet(data);
  ws['!cols']=Object.keys(data[0]||{}).map(k=>({wch:Math.max(k.length,...data.map(r=>String(r[k]||'').length))+2}));
  window.XLSX.utils.book_append_sheet(wb,ws,sheet);
  window.XLSX.writeFile(wb,`${fname}_${new Date().toISOString().slice(0,10)}.xlsx`);
  toast.success('Exported!',`${fname} saved as Excel.`);
};
const exportPDF=(headers,rows,fname,title)=>{

function TaskCard({task,onComplete,globalUserTasksState}){
  const isDone=globalUserTasksState?.[task.id]||globalUserTasksState?.[String(task.id)]||false;
  const [state,setState]=useState(isDone?'done':'idle');
  const [secs,setSecs]=useState(30);
  const timerRef=useRef(null);
  useEffect(()=>{if(globalUserTasksState?.[task.id]||globalUserTasksState?.[String(task.id)])setState('done');},[globalUserTasksState,task.id]);
  const startTask=()=>{
    window.open(task.url,'_blank');setState('counting');let s=30;
    timerRef.current=setInterval(()=>{ s--;setSecs(s); if(s<=0){clearInterval(timerRef.current);setState('done');onComplete(task.id,task.reward);toast.success('Task Completed!',`+${naira(task.reward)} credited.`);} },1000);
  };
  useEffect(()=>()=>clearInterval(timerRef.current),[]);
  const tc=TASK_CLR[task.type]||TASK_CLR.video,done=state==='done';
  return(
    <div className={`task-card ${done?'done':''}`} style={{borderLeft:`3px solid ${tc.border}`}}>

          </div>

// ── AUTH ───────────────────────────────────────────────────────────────────
function AuthPage({mode,setScreen,onLoginSuccess,initialSelectedPlan,onRegisterNewUser}){
  const isLogin=mode==='login';
  const [step,setStep]=useState(1);
  const [selPlan,setSelPlan]=useState(initialSelectedPlan||'basic');
  const [form,setForm]=useState({name:'',email:'',phone:'',password:''});
  const [busy,setBusy]=useState(false);
  useEffect(()=>{if(initialSelectedPlan)setSelPlan(initialSelectedPlan);},[initialSelectedPlan]);
  const sf=(k,v)=>setForm(p=>({...p,[k]:v}));

  const handleSubmit=async(e)=>{
    e.preventDefault(); setBusy(true);
    const email=form.email.toLowerCase().trim();
    try{
      if(isLogin){
        const {data,error}=await db.auth.signInWithPassword({email,password:form.password});
        if(error)throw error;
        if(email===ADMIN_EMAIL){
          toast.success('Admin Access Granted','Welcome to the command centre.');
          onLoginSuccess('admin',{id:data.user.id,name:'System Administrator',email});
          return;
        }
        const {data:profile,error:pErr}=await db.from('profiles').select('*').eq('id',data.user.id).single();
        if(pErr||!profile){toast.error('Profile Error','Profile data missing.');return;}
        if(!profile.paid){toast.error('Access Denied','No activation payment detected.');return;}
        toast.success('Login Successful',`Welcome back, ${profile.name.split(' ')[0]}!`);
        onLoginSuccess(profile.plan,profile);
      } else { setStep(2); }
    }catch(err){toast.error('Authentication Failed',err.message||'Check your credentials.');}
    finally{setBusy(false);}
  };

  const handlePaystack=()=>{
    const email=form.email.toLowerCase().trim();
    if(!email||!form.name.trim()){toast.error('Missing Info','Fill in name and email.');setStep(1);return;}
    if(typeof window.PaystackPop==='undefined'){toast.error('Payment Error','Paystack not loaded. Refresh.');return;}
    const amt=(selPlan==='premium'?8000:4000)*100;
    try{
      const pp=new window.PaystackPop();
      pp.newTransaction({
        key:'pk_live_56cd68f5adb0e165c34545bee318900fcd3505e3',
        email,amount:amt,currency:'NGN',
        metadata:{custom_fields:[{display_name:'Full Name',variable_name:'customer_name',value:form.name},{display_name:'Plan',variable_name:'plan',value:selPlan}]},
        onSuccess:async(tx)=>{
          toast.info('Payment Received',`Ref: ${tx.reference} — Setting up account…`);
          setBusy(true);
          try{
            const {data:authData,error:authErr}=await db.auth.signUp({email:form.email.toLowerCase().trim(),password:form.password});
            if(authErr)throw authErr;
            const bal=selPlan==='premium'?1000:500;
            const profile={id:authData.user.id,name:form.name,email:form.email.toLowerCase().trim(),plan:selPlan,balance:bal,paid:true,status:'active',joined:new Date().toLocaleDateString('en-NG',{day:'2-digit',month:'short',year:'numeric'}),total_referrals:0,referral_earnings:0};
            const {error:pErr}=await db.from('profiles').insert([profile]);
            if(pErr)throw pErr;
            // Referral
            const ref=localStorage.getItem('9ja_active_ref_code');
            if(ref){
              const snip=ref.split('-').pop();
              const {data:all}=await adminDb.from('profiles').select('*');
              if(all){
                const parent=all.find(p=>p.id&&p.id.toString().slice(-4)===snip);
                if(parent){
                  const comm=parent.plan==='premium'?1000:500;
                  await adminDb.from('profiles').update({balance:(parent.balance||0)+comm,total_referrals:(parent.total_referrals||0)+1,referral_earnings:(parent.referral_earnings||0)+comm}).eq('id',parent.id);
                  localStorage.removeItem('9ja_active_ref_code');
                }
              }
            }
            store.set(SK.UP(form.email),profile);
            if(onRegisterNewUser)onRegisterNewUser({id:profile.id,name:profile.name,email:profile.email,plan:profile.plan,balance:profile.balance,joined:profile.joined,tasks:0,refs:0,status:'active'});
            toast.success('Welcome to 9jaWatchers! 🎉',`Account live, ${form.name.split(' ')[0]}!`);
            onLoginSuccess(selPlan,profile);
          }catch(err){toast.error('Setup Failed',`Payment ok but setup failed: ${err.message}`);}
          finally{setBusy(false);}
        },
        onCancel:()=>toast.warning('Payment Cancelled','Not completed.'),
        onError:err=>toast.error('Payment Error',err.message||'Something went wrong.')
      });
    }catch(err){toast.error('Gateway Error','Unable to connect to Paystack.');}
  };

  return(
    <div style={{minHeight:'100vh',background:'var(--bg)',display:'flex',flexDirection:'column'}}>
      <div style={{padding:'16px 24px',borderBottom:'1px solid var(--border)',background:'var(--surface)'}}>
        <button onClick={()=>setScreen('landing')} style={{background:'none',border:'none',cursor:'pointer',display:'flex',alignItems:'center',gap:6,color:'var(--text-2)',fontSize:14,fontWeight:600,fontFamily:'inherit'}}>← <Logo size="sm"/></button>
      </div>
      <div style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center',padding:20}}>
        <div className="fade-in" style={{width:'100%',maxWidth:440}}>
          {!isLogin&&(<div style={{display:'flex',alignItems:'center',justifyContent:'center',gap:8,marginBottom:28}}>
            <div className="step-dot" style={{width:step===1?20:8,background:step>=1?'var(--green)':'var(--border)',borderRadius:99,transition:'all 0.3s'}}/>
            <div style={{flex:1,maxWidth:60,height:1,background:step>=2?'var(--green)':'var(--border)',transition:'background 0.3s'}}/>
            <div className="step-dot" style={{width:step===2?20:8,background:step>=2?'var(--green)':'var(--border)',borderRadius:99,transition:'all 0.3s'}}/>
          </div>)}
          <div className="card">
            <div style={{textAlign:'center',marginBottom:28}}>
              <h2 style={{fontSize:22,fontWeight:900,marginBottom:6,fontFamily:"'Sora',sans-serif"}}>{isLogin?'Welcome Back':step===1?'Create Your Account':'Activate Your Plan'}</h2>
              <p style={{color:'var(--text-3)',fontSize:14}}>{isLogin?'Sign in to your earnings dashboard':step===1?'Join thousands of Nigerians earning daily':'Complete payment to start earning'}</p>
            </div>
            {step===1?(
              <form onSubmit={handleSubmit} style={{display:'flex',flexDirection:'column',gap:14}}>
                {!isLogin&&(<div><label style={{fontSize:12,fontWeight:700,color:'var(--text-2)',display:'block',marginBottom:6}}>Full Name <span style={{color:'var(--red)'}}>*</span></label><input required type="text" className="input" placeholder="Same as your bank account name" value={form.name} onChange={e=>sf('name',e.target.value)}/></div>)}
                <div><label style={{fontSize:12,fontWeight:700,color:'var(--text-2)',display:'block',marginBottom:6}}>Email Address <span style={{color:'var(--red)'}}>*</span></label><input required type="email" className="input" placeholder="you@example.com" value={form.email} onChange={e=>sf('email',e.target.value)}/></div>
                {!isLogin&&(<div><label style={{fontSize:12,fontWeight:700,color:'var(--text-2)',display:'block',marginBottom:6}}>Phone Number <span style={{color:'var(--red)'}}>*</span></label><input required type="tel" className="input" placeholder="08012345678" value={form.phone} onChange={e=>sf('phone',e.target.value)}/></div>)}
                <div><label style={{fontSize:12,fontWeight:700,color:'var(--text-2)',display:'block',marginBottom:6}}>Password <span style={{color:'var(--red)'}}>*</span></label><input required type="password" className="input" placeholder="At least 8 characters" value={form.password} onChange={e=>sf('password',e.target.value)}/></div>
                <button className="btn btn-primary btn-full btn-lg" disabled={busy} type="submit" style={{marginTop:6}}>{busy?'⟳ Please wait…':isLogin?'Sign In':'Continue to Payment →'}</button>
                <p style={{textAlign:'center',fontSize:13,color:'var(--text-3)',marginTop:4}}>
                  {isLogin?"Don't have an account? ":'Already registered? '}
                  <span style={{color:'var(--green)',cursor:'pointer',fontWeight:700}} onClick={()=>setScreen(isLogin?'signup':'login')}>{isLogin?'Register here':'Sign in'}</span>
                </p>
              </form>
            ):(
              <div className="slide-down" style={{display:'flex',flexDirection:'column',gap:14}}>
                <div style={{display:'flex',flexDirection:'column',gap:10}}>
                  {[{key:'basic',label:'Basic Plan',price:'₦4,000',desc:'8 tasks/day · ₦500 bonus'},{key:'premium',label:'Premium Plan',price:'₦8,000',desc:'20 tasks/day · ₦1,000 bonus',hi:true}].map(p=>(
                    <div key={p.key} onClick={()=>setSelPlan(p.key)} style={{padding:'14px 16px',borderRadius:10,cursor:'pointer',border:`2px solid ${selPlan===p.key?(p.hi?'var(--purple)':'var(--green)'):'var(--border)'}`,background:selPlan===p.key?(p.hi?'var(--purple-light)':'var(--green-light)'):'var(--bg)',transition:'all 0.2s',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                      <div><div style={{fontWeight:800,fontSize:14}}>{p.label}</div><div style={{fontSize:12,color:'var(--text-3)',marginTop:2}}>{p.desc}</div></div>
                      <div style={{fontWeight:900,fontSize:16,color:p.hi?'var(--purple)':'var(--green)'}}>{p.price}</div>
                    </div>
                  ))}
                </div>
                <div className="info-box" style={{background:'var(--green-light)',borderRadius:'var(--radius-sm)'}}><span>🔒</span><div style={{fontSize:13,color:'var(--text-2)',lineHeight:1.5}}>Secured by <strong>Paystack</strong>. Fully encrypted.</div></div>
                <button className="btn btn-primary btn-full btn-lg" disabled={busy} onClick={handlePaystack}>{busy?'⟳ Processing…':`Pay ${selPlan==='premium'?'₦8,000':'₦4,000'} & Activate`}</button>
                <button className="btn btn-ghost btn-sm btn-full" onClick={()=>setStep(1)}>← Go Back</button>
              </div>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

  // ─────────────────────────────────────────────────────────────────────────
  const [userWD, setUserWD] = useState([]);
  const [wdLoading, setWdLoading] = useState(false);

  useEffect(() => {
    if (!currentUser?.email) return;

    const fetchUserWD = async () => {
      // Wait for the Supabase JWT to be ready before querying.
      // On page refresh the JWT restores asynchronously — without this check
      // the query runs as anon, RLS returns [] and the list stays empty.
      const { data: { session } } = await db.auth.getSession();
      if (!session) return; // onAuthStateChange will trigger a retry

      setWdLoading(true);
      try {
        const { data, error } = await db
          .from('withdrawals')
          .select('*')
          .eq('email', currentUser.email)
          .order('id', { ascending: false });
        if (!error && data) {
          setUserWD(data.map(w => ({
            id: w.id,
            amount: w.amount,
            bank: w.bank || '',
            account: w.account_number || w.account || '',
            accountName: w.account_name || '',
            status: w.status,
            date: w.request_date || w.date || '—',
          })));
        }
      } catch(e) {}
      finally { setWdLoading(false); }
    };

    // Initial fetch
    fetchUserWD();

    // Re-fetch once Supabase restores the session after a browser refresh.
    // INITIAL_SESSION is the key event — it fires when the persisted JWT is ready.
    const { data: { subscription: authSub } } = db.auth.onAuthStateChange((event, session) => {
      if (session && (event === 'INITIAL_SESSION' || event === 'SIGNED_IN' || event === 'TOKEN_REFRESHED')) {
        fetchUserWD();
      }
    });

    // Realtime: re-fetch whenever any withdrawal row changes (e.g. admin approves/rejects)
    const ch = db.channel(`user-wd-${currentUser.email}`)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'withdrawals' }, () => fetchUserWD())
      .subscribe();

    return () => {
      authSub.unsubscribe();
      db.removeChannel(ch);
    };
  }, [currentUser?.email]);

  const isPrem=plan==='premium';
  const myTasks=globalTasksList.filter(t=>t.plan==='both'||t.plan===plan);
  const [histLog,setHistLog]=useState(()=>{
    const s=store.get(SK.UP(currentUser?.email||''));
    return s?.historyLog||[{label:'Welcome Bonus — Account Activated',amount:isPrem?1000:500,type:'credit',timestamp:'Account Created'}];
  });

  // Task realtime sync
  useEffect(()=>{
    const fetchTasks=async()=>{
      try{
        const {data}=await db.from('tasks').select('*').order('id',{ascending:true});
        if(data&&data.length>0){setGlobalTasksList(data);store.set(SK.TASKS,data);}
      }catch(e){}
    };
    fetchTasks();
    const ch=db.channel('tasks-user').on('postgres_changes',{event:'*',schema:'public',table:'tasks'},()=>fetchTasks()).subscribe();
    return()=>db.removeChannel(ch);
  },[]);

  useEffect(()=>{
    if(!currentUser?.id||page!=='referrals')return;
    const f=async()=>{
      try{
        const {data}=await db.from('profiles').select('total_referrals,referral_earnings,balance').eq('id',currentUser.id).single();
        if(data){setLiveRefs(data.total_referrals||0);setLiveEarn(data.referral_earnings||0);setUserBalance(data.balance);}
      }catch(e){}
    };
    f();
  },[page,currentUser?.id]);

  const refCode=`9JW-${isPrem?'PREM':'BASC'}-${currentUser?.id?.toString().slice(-4)||'2026'}`;
  const refLink=`https://naijawatchers.com/?ref=${refCode}`;
  const doneCount=myTasks.filter(t=>globalUserTasksState[t.id]||globalUserTasksState[String(t.id)]).length;
  const earnedToday=myTasks.filter(t=>globalUserTasksState[t.id]||globalUserTasksState[String(t.id)]).reduce((s,t)=>s+t.reward,0);

  useEffect(()=>{
    if(!currentUser?.email)return;
    const s=store.get(SK.UP(currentUser.email))||{};
    store.set(SK.UP(currentUser.email),{...s,balance:userBalance,tasksState:globalUserTasksState,historyLog:histLog,total_referrals:liveRefs,referral_earnings:liveEarn});
  },[userBalance,globalUserTasksState,histLog,liveRefs,liveEarn]);

  const handleTaskDone=async(taskId,reward)=>{
    const newBal=userBalance+reward,newState={...globalUserTasksState,[String(taskId)]:true};
    setGlobalUserTasksState(newState);setUserBalance(newBal);
    const t=myTasks.find(t=>t.id===taskId);
    setHistLog(p=>[{label:`Task: ${t?.title?.substring(0,40)||'Task'}`,amount:reward,type:'credit',timestamp:'Just Now'},...p]);
    if(currentUser?.id){
      try{ await db.from('profiles').update({balance:newBal,tasks_state:newState}).eq('id',currentUser.id); }catch(e){}
    }
    const s=store.get(SK.UP(currentUser?.email||''))||{};
    store.set(SK.UP(currentUser?.email||''),{...s,balance:newBal,tasksState:newState});
  };

  const submitWD=async(e)=>{
    e.preventDefault();
    const amt=Number(wdForm.amount);
    if(amt<2000){toast.error('Minimum Amount','Minimum withdrawal is ₦2,000.');return;}
    if(amt>userBalance){toast.error('Insufficient Balance',`Your balance is ${naira(userBalance)}.`);return;}
    const newBal=userBalance-amt;
    setUserBalance(newBal);
    const req={user_name:currentUser?.name||'Unknown',email:currentUser?.email||'',plan,bank:wdForm.bank,account_number:wdForm.account,account_name:wdForm.name,amount:amt,status:'pending',request_date:new Date().toLocaleDateString('en-NG',{day:'2-digit',month:'short',year:'numeric'})};
    try{
      const {data:ins,error}=await db.from('withdrawals').insert([req]).select().single();
      if(error)throw error;
      // Append to local user WD list immediately for instant UI feedback
      setUserWD(p=>[{id:ins.id,amount:ins.amount,bank:ins.bank,account:ins.account_number,accountName:ins.account_name,status:ins.status,date:ins.request_date},...p]);
    }catch(e){toast.error('Withdrawal Error',e.message);setUserBalance(userBalance);return;}
    if(currentUser?.id){try{await db.from('profiles').update({balance:newBal}).eq('id',currentUser.id);}catch(e){}}
    setWdSuccess(true);
    toast.success('Withdrawal Requested',`${naira(amt)} pending admin approval.`);
  };

  const statusStyle=s=>s==='approved'?{background:'var(--green-light)',color:'var(--green)',border:'1px solid #86efac'}:s==='rejected'?{background:'var(--red-light)',color:'var(--red)',border:'1px solid #fca5a5'}:{background:'var(--gold-light)',color:'var(--gold)',border:'1px solid #fcd34d'};
  const statusIcon=s=>s==='approved'?'✓':s==='rejected'?'✕':'⏳';

  const navItems=[
    {id:'dashboard',icon:'🏠',label:'Dashboard'},
    {id:'withdraw',icon:'💳',label:'Withdraw Funds'},
    {id:'wd-history',icon:'🧾',label:'Withdrawal History'},
    {id:'referrals',icon:'👥',label:'Referrals'},
    {id:'history',icon:'📜',label:'Transaction History'},
  ];

  return(
    <div className="app-shell">
      <Sidebar items={navItems} active={page} setPage={setPage} plan={plan} onLogout={onLogout} onUpgrade={()=>setShowUpgrade(true)} currentUser={currentUser} balance={userBalance}/>
      {showUpgrade&&(
        <div className="modal-overlay" onClick={()=>setShowUpgrade(false)}>
          <div className="modal-box" onClick={e=>e.stopPropagation()}>
            <div style={{textAlign:'center',marginBottom:20}}><div style={{fontSize:40,marginBottom:12}}>⭐</div><h3 style={{fontSize:20,fontWeight:900,marginBottom:8}}>Upgrade to Premium</h3><p style={{color:'var(--text-2)',fontSize:14,lineHeight:1.6}}>Unlock 20 tasks daily, ₦1,000 bonus, and priority withdrawals.</p></div>
            <button className="btn btn-gold btn-full" onClick={()=>{
              if(typeof window.PaystackPop==='undefined'){toast.error('Payment Error','Paystack not loaded.');return;}
              const pp=new window.PaystackPop();
              pp.newTransaction({key:'pk_live_56cd68f5adb0e165c34545bee318900fcd3505e3',email:currentUser?.email||'',amount:8000*100,currency:'NGN',
                onSuccess:async()=>{ setShowUpgrade(false); try{ await db.from('profiles').update({plan:'premium',balance:(userBalance||0)+1000}).eq('id',currentUser.id); setUserBalance(p=>p+1000); toast.success('Upgrade Successful! 🎉','You are now on Premium!'); setTimeout(()=>window.location.reload(),2000); }catch(err){toast.error('Upgrade Error',err.message);} },
                onCancel:()=>toast.warning('Cancelled','Upgrade not completed.'),
                onError:err=>toast.error('Payment Error',err.message||'Something went wrong.')
              });
            }}>Pay ₦8,000 to Upgrade</button>
            <button className="btn btn-ghost btn-sm btn-full" style={{marginTop:8}} onClick={()=>setShowUpgrade(false)}>Maybe Later</button>
          </div>
        </div>
      )}
      <div className="main-scroll">
        <div className="main-content" style={{padding:'32px 36px',maxWidth:900,margin:'0 auto'}}>

          {/* DASHBOARD */}
          {page==='dashboard'&&(<div className="fade-in">
            <div style={{marginBottom:28}}><h1 style={{fontSize:26,fontWeight:900,marginBottom:4,fontFamily:"'Sora',sans-serif"}}>Hey, {currentUser?.name?.split(' ')[0]||'Earner'} 👋</h1><p style={{color:'var(--text-3)',fontSize:14}}>Here's your earning overview for today.</p></div>
            <div className="stats-row" style={{display:'flex',gap:16,marginBottom:28,flexWrap:'wrap'}}>
              <StatCard label="Available Balance" value={naira(userBalance)} icon="💰" accent="gold"/>
              <StatCard label="Earned Today" value={naira(earnedToday)} icon="📈" accent="green"/>
              <StatCard label="Tasks Done" value={`${doneCount}/${myTasks.length}`} icon="⚡" accent="blue"/>
            </div>
            <div className="card" style={{marginBottom:28}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}><span style={{fontWeight:700,fontSize:14}}>Daily Progress</span><span style={{fontWeight:800,color:'var(--green)',fontSize:14}}>{Math.round((doneCount/(myTasks.length||1))*100)}%</span></div>
              <div className="progress-track"><div className="progress-fill" style={{width:`${(doneCount/(myTasks.length||1))*100}%`,background:'var(--green)'}}/></div>
              <div style={{display:'flex',justifyContent:'space-between',marginTop:8,fontSize:12,color:'var(--text-3)',fontWeight:600}}><span>{doneCount} completed</span><span>{myTasks.length-doneCount} remaining</span></div>
            </div>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}}><h2 style={{fontSize:17,fontWeight:800}}>Available Tasks</h2><Badge color={isPrem?'purple':'green'}>{isPrem?'Premium':'Basic'} Plan</Badge></div>
            <div style={{display:'flex',flexDirection:'column',gap:10}}>
              {myTasks.length===0?<div className="card" style={{textAlign:'center',padding:40,color:'var(--text-3)'}}>No tasks available. Check back soon!</div>:myTasks.map(task=><TaskCard key={task.id} task={task} onComplete={handleTaskDone} globalUserTasksState={globalUserTasksState}/>)}
            </div>
          </div>)}

          {/* WITHDRAW */}
          {page==='withdraw'&&(<div className="fade-in">
            <div style={{marginBottom:28}}><h1 style={{fontSize:24,fontWeight:900,marginBottom:4,fontFamily:"'Sora',sans-serif"}}>Withdraw Funds</h1><p style={{color:'var(--text-3)',fontSize:14}}>Request a withdrawal to your Nigerian bank account.</p></div>
            {wdSuccess?(
              <div className="card" style={{textAlign:'center',padding:'48px 32px'}}>
                <div style={{width:64,height:64,borderRadius:'50%',background:'var(--green-light)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:28,margin:'0 auto 16px'}}>✓</div>
                <h3 style={{fontSize:20,fontWeight:900,marginBottom:8}}>Withdrawal Submitted!</h3>
                <p style={{color:'var(--text-2)',fontSize:14,marginBottom:24,lineHeight:1.6}}>Pending admin approval. Typically released within 24 hours.</p>
                <div style={{display:'flex',gap:10,justifyContent:'center',flexWrap:'wrap'}}>
                  <button className="btn btn-primary" onClick={()=>{setWdSuccess(false);setWdForm({bank:'',account:'',name:currentUser?.name||'',amount:''});}}>New Withdrawal</button>
                  <button className="btn btn-ghost" onClick={()=>setPage('wd-history')}>View History →</button>
                </div>
              </div>
            ):(
              <div className="withdraw-layout" style={{display:'flex',gap:24,flexWrap:'wrap',alignItems:'flex-start'}}>
                <form onSubmit={submitWD} className="card" style={{flex:2,minWidth:300}}>
                  <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:20,paddingBottom:16,borderBottom:'1px solid var(--border)'}}><span style={{fontSize:14,color:'var(--text-2)',fontWeight:600}}>Available Balance</span><span style={{fontWeight:900,fontSize:20,color:'var(--gold)'}}>{naira(userBalance)}</span></div>
                  <div style={{display:'flex',flexDirection:'column',gap:14}}>
                    <div><label style={{fontSize:12,fontWeight:700,color:'var(--text-2)',display:'block',marginBottom:6}}>Bank Name</label>
                    <select required className="input" value={wdForm.bank} onChange={e=>setWdForm(p=>({...p,bank:e.target.value}))}><option value="">Select your bank</option>{['GTBank','Zenith Bank','Access Bank','UBA','First Bank','Kuda Bank','Opay','PalmPay','Moniepoint','Wema Bank'].map(b=><option key={b} value={b}>{b}</option>)}</select></div>
                    <div><label style={{fontSize:12,fontWeight:700,color:'var(--text-2)',display:'block',marginBottom:6}}>Account Number (10 digits)</label><input required type="text" maxLength={10} pattern="\d{10}" className="input" placeholder="0123456789" value={wdForm.account} onChange={e=>setWdForm(p=>({...p,account:e.target.value}))}/></div>
                    <div><label style={{fontSize:12,fontWeight:700,color:'var(--text-2)',display:'block',marginBottom:6}}>Account Name</label><input required type="text" className="input" placeholder="Name as on bank account" value={wdForm.name} onChange={e=>setWdForm(p=>({...p,name:e.target.value}))}/></div>
                    <div><label style={{fontSize:12,fontWeight:700,color:'var(--text-2)',display:'block',marginBottom:6}}>Amount (₦)</label><input required type="number" min={2000} max={userBalance} className="input" placeholder="Minimum ₦2,000" value={wdForm.amount} onChange={e=>setWdForm(p=>({...p,amount:e.target.value}))}/></div>
                    <button className="btn btn-primary btn-full" type="submit" disabled={userBalance<2000} style={{marginTop:6}}>{userBalance<2000?`Need ₦${(2000-userBalance).toLocaleString()} more`:'Submit Withdrawal Request'}</button>
                  </div>
                </form>
                <div style={{flex:1,minWidth:220}}>
                  <div className="card" style={{background:'var(--green-light)',border:'1px solid #86efac'}}>
                    <h4 style={{fontWeight:800,fontSize:13,marginBottom:12,color:'var(--green)',textTransform:'uppercase',letterSpacing:'0.05em'}}>Withdrawal Rules</h4>
                    {[['Minimum','₦2,000'],['Processing Time','≤ 24 hours'],['Payment Method','Paystack Direct'],['Transaction Fee','₦0.00']].map(([l,v])=>(<div key={l} className="withdraw-info-row"><span>{l}</span><strong style={l==='Transaction Fee'?{color:'var(--green)'}:{}}>{v}</strong></div>))}
                  </div>
                </div>
              </div>
            )}
          </div>)}

          {/* WITHDRAWAL HISTORY — uses dedicated userWD state */}
          {page==='wd-history'&&(<div className="fade-in">
            <div style={{marginBottom:28,display:'flex',justifyContent:'space-between',alignItems:'flex-start',flexWrap:'wrap',gap:12}}>
              <div>
                <h1 style={{fontSize:24,fontWeight:900,marginBottom:4,fontFamily:"'Sora',sans-serif"}}>Withdrawal History</h1>
                <div style={{display:'flex',alignItems:'center',gap:6,fontSize:13,color:'var(--text-3)'}}>
                  <span className="live-dot"/>
                  <span>Live — updates instantly when admin approves or rejects</span>
                </div>
              </div>
            </div>
            {wdLoading?(
              <div className="loader-wrap"><div className="loader-ring"/><span>Loading your withdrawal history…</span></div>
            ):userWD.length===0?(
              <div className="card" style={{textAlign:'center',padding:'48px 32px'}}>
                <div style={{fontSize:40,marginBottom:16}}>🧾</div>
                <h3 style={{fontWeight:800,fontSize:17,marginBottom:8}}>No Withdrawals Yet</h3>
                <p style={{color:'var(--text-3)',fontSize:14,marginBottom:20}}>You haven't placed any withdrawal requests yet.</p>
                <button className="btn btn-primary btn-sm" onClick={()=>setPage('withdraw')}>Request Withdrawal</button>
              </div>
            ):(
              <div style={{display:'flex',flexDirection:'column',gap:12}}>
                <div className="stats-row" style={{display:'flex',gap:16,marginBottom:8,flexWrap:'wrap'}}>
                  <StatCard label="Total Requested" value={naira(userWD.reduce((s,w)=>s+w.amount,0))} icon="📤" accent="blue"/>
                  <StatCard label="Approved" value={naira(userWD.filter(w=>w.status==='approved').reduce((s,w)=>s+w.amount,0))} icon="✅" accent="green"/>
                  <StatCard label="Pending" value={userWD.filter(w=>w.status==='pending').length} icon="⏳" accent="gold"/>
                </div>
                {userWD.map(w=>(
                  <div key={w.id} className="card" style={{padding:'16px 20px'}}>
                    <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',flexWrap:'wrap',gap:12}}>
                      <div style={{flex:1,minWidth:200}}>
                        <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:6}}>
                          <div style={{width:38,height:38,borderRadius:10,background:w.status==='approved'?'var(--green-light)':w.status==='rejected'?'var(--red-light)':'var(--gold-light)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:16,flexShrink:0}}>{statusIcon(w.status)}</div>
                          <div><div style={{fontWeight:800,fontSize:16}}>{naira(w.amount)}</div><div style={{fontSize:11,color:'var(--text-3)',marginTop:1}}>{w.date}</div></div>
                        </div>
                        <div style={{fontSize:12,color:'var(--text-2)',marginLeft:48}}><strong>{w.bank}</strong> · {w.account}{w.accountName?` · ${w.accountName}`:''}</div>
                      </div>
                      <span className="badge" style={statusStyle(w.status)}>{w.status==='approved'?'✓ Approved':w.status==='rejected'?'✕ Rejected':'⏳ Pending'}</span>
                    </div>
                    {w.status==='pending'&&<div style={{marginTop:10,paddingTop:10,borderTop:'1px solid var(--border)',fontSize:12,color:'var(--text-3)'}}>ℹ️ Under review — typically processed within 24 hours</div>}
                    {w.status==='approved'&&<div style={{marginTop:10,paddingTop:10,borderTop:'1px solid var(--border)',fontSize:12,color:'var(--green)',fontWeight:600}}>🎉 Payment approved and sent to your bank account</div>}
                    {w.status==='rejected'&&<div style={{marginTop:10,paddingTop:10,borderTop:'1px solid var(--border)',fontSize:12,color:'var(--red)',fontWeight:600}}>✕ Request declined. Contact support if you believe this is an error.</div>}
                  </div>
                ))}
              </div>
            )}
          </div>)}

          {/* REFERRALS */}
          {page==='referrals'&&(<div className="fade-in">
            <div style={{marginBottom:28}}><h1 style={{fontSize:24,fontWeight:900,marginBottom:4,fontFamily:"'Sora',sans-serif"}}>Referral Earnings</h1><p style={{color:'var(--text-3)',fontSize:14}}>Share your link — earn {isPrem?'₦1,000':'₦500'} for every person who registers.</p></div>
            <div className="card" style={{marginBottom:20}}>
              <label style={{fontSize:12,fontWeight:700,color:'var(--text-2)',display:'block',marginBottom:8}}>Your Referral Link</label>
              <div style={{display:'flex',gap:10}}><input readOnly type="text" className="input" value={refLink} style={{fontWeight:600,fontSize:13,color:'var(--green)'}}/><button className="btn btn-primary btn-sm" style={{flexShrink:0}} onClick={()=>{navigator.clipboard?.writeText(refLink);toast.success('Link Copied!','Share it and earn when friends register.');}}>Copy</button></div>
            </div>
            <div className="stats-row" style={{display:'flex',gap:16,flexWrap:'wrap',marginBottom:20}}>
              <StatCard label="Total Referrals" value={`${liveRefs} users`} icon="👥" accent="blue"/>
              <StatCard label="Referral Earnings" value={naira(liveEarn)} icon="💰" accent="gold"/>
              <StatCard label="Per Referral" value={isPrem?'₦1,000':'₦500'} icon="🎯" accent="green"/>
            </div>
            <div className="card" style={{background:'var(--purple-light)',border:'1px solid #c4b5fd'}}>
              <h4 style={{fontWeight:800,fontSize:14,marginBottom:10,color:'var(--purple)'}}>How it works</h4>
              {['Share your unique link with friends','They register and pay their activation fee','You instantly earn your commission','No limit on how many people you can refer!'].map((s,i)=>(
                <div key={i} style={{display:'flex',gap:12,marginBottom:8,alignItems:'flex-start'}}><span style={{width:22,height:22,borderRadius:'50%',background:'var(--purple)',color:'#fff',display:'inline-flex',alignItems:'center',justifyContent:'center',fontSize:11,fontWeight:800,flexShrink:0}}>{i+1}</span><span style={{fontSize:13,color:'var(--text-2)',lineHeight:1.5}}>{s}</span></div>
              ))}
            </div>
          </div>)}

          {/* TRANSACTION HISTORY */}
          {page==='history'&&(<div className="fade-in">
            <div style={{marginBottom:28}}><h1 style={{fontSize:24,fontWeight:900,marginBottom:4,fontFamily:"'Sora',sans-serif"}}>Transaction History</h1><p style={{color:'var(--text-3)',fontSize:14}}>All credits and debits on your account.</p></div>
            <div style={{display:'flex',flexDirection:'column',gap:10}}>
              {histLog.map((log,i)=>(
                <div key={i} className="card" style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'14px 18px'}}>
                  <div style={{display:'flex',alignItems:'center',gap:12}}>
                    <div style={{width:36,height:36,borderRadius:10,background:log.type==='credit'?'var(--green-light)':'var(--red-light)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:16}}>{log.type==='credit'?'↓':'↑'}</div>
                    <div><div style={{fontWeight:700,fontSize:14}}>{log.label}</div><div style={{color:'var(--text-3)',fontSize:11,marginTop:2}}>{log.timestamp}</div></div>
                  </div>
                  <span style={{fontWeight:900,fontSize:16,color:log.type==='credit'?'var(--green)':'var(--red)'}}>{log.type==='credit'?'+':'-'}{naira(log.amount)}</span>
                </div>
              ))}
            </div>
          </div>)}
        </div>
      </div>
    </div>
  );
}

// ── ADMIN DASHBOARD ────────────────────────────────────────────────────────
function AdminDashboard({onLogout,globalTasksList,setGlobalTasksList,userManagementRows,setUserManagementRows,withdrawalsList,setWithdrawalsList}){
  const [page,setPage]=useState('overview');
  const [taskForm,setTaskForm]=useState({type:'video',title:'',url:'',reward:'',plan:'both'});
  const [taskSaved,setTaskSaved]=useState(false);
  const [confirm,setConfirm]=useState({open:false});

  const pending=withdrawalsList.filter(w=>w.status==='pending');
  const totalPaid=withdrawalsList.filter(w=>w.status==='approved').reduce((s,w)=>s+w.amount,0);

  // ─────────────────────────────────────────────────────────────────────────
  // FIX: Admin fetches ALL users via adminDb (service-role bypasses RLS).
  // A dedicated Realtime channel inside this component fires AFTER the admin
  // is already authenticated, so it subscribes with the correct credentials.
  // ─────────────────────────────────────────────────────────────────────────
 // AFTER — use db (anon client with authenticated JWT)
useEffect(()=>{
  const fetchUsers=async()=>{
    try{
      const {data,error}=await db.from('profiles').select('*').order('id',{ascending:false});
      if(!error&&data){
        setUserManagementRows(data.map(p=>({
          id:p.id, name:p.name||'Unknown', email:p.email||'',
          plan:p.plan||'basic', balance:p.balance||0,
          joined:p.joined||'—', tasks:0,
          refs:p.total_referrals||0, status:p.status||'active'
        })));
      }
    }catch(e){console.error('fetchUsers:',e);}
  };
  fetchUsers();
  const ch=db.channel('admin-profiles-rt')
    .on('postgres_changes',{event:'*',schema:'public',table:'profiles'},()=>fetchUsers())
    .subscribe();
  return()=>db.removeChannel(ch);
},[]);

              <div>

                <div style={{display:'flex',alignItems:'center',gap:6,fontSize:13,color:'var(--text-3)'}}><span className="live-dot"/><span>Real-time — new requests appear instantly</span></div>

              <div className="export-btn-group" style={{display:'flex',gap:8}}><button className="btn btn-primary btn-sm" onClick={exportWDXLS}>📊 Export XLS</button><button className="btn btn-blue btn-sm" onClick={exportWDPDF}>📄 Export PDF</button></div>
            </div>
            <div style={{display:'flex',flexDirection:'column',gap:14}}>
              {withdrawalsList.length===0?(<div className="card" style={{textAlign:'center',padding:40,color:'var(--text-3)'}}>No withdrawal requests yet.</div>)
              :withdrawalsList.slice().reverse().map(w=>(
                <div key={w.id} className="card" style={{display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:14}}>
                  <div>

                    <div style={{fontSize:12,color:'var(--text-3)',marginBottom:2}}>{w.email||'—'}</div>

// ── APP ROOT ────────────────────────────────────────────────────────────────
function App(){
  const [screen,setScreen]=useState('landing');
  const [planOverride,setPlanOverride]=useState(null);
  const [roleContext,setRoleContext]=useState(null);
  const [currentUser,setCurrentUser]=useState(null);
  const [globalTasksList,setGlobalTasksList]=useState(()=>store.get(SK.TASKS)||INIT_TASKS);
  const [userManagementRows,setUserManagementRows]=useState([]);
  const [withdrawalsList,setWithdrawalsList]=useState([]);
  const [userBalance,setUserBalance]=useState(500);
  const [globalUserTasksState,setGlobalUserTasksState]=useState({});

  useEffect(()=>{
    const init=async()=>{
      const ref=new URLSearchParams(window.location.search).get('ref');
      if(ref)localStorage.setItem('9ja_active_ref_code',ref.trim());

      // Restore session from storage
      const session=store.get(SK.SESSION);
      if(session&&session.role&&session.user){
        setRoleContext(session.role);
        setCurrentUser(session.user);
        setScreen('portal');
        if(session.role!=='admin'){
          // Fetch fresh balance + tasks state using anon client (RLS allows own row)
          try{
            const {data}=await db.from('profiles').select('balance,tasks_state').eq('id',session.user.id).single();
            if(data){
              if(data.balance!==undefined)setUserBalance(data.balance);
              if(data.tasks_state){const n={};Object.keys(data.tasks_state).forEach(k=>{n[String(k)]=data.tasks_state[k];});setGlobalUserTasksState(n);}
            }
          }catch(e){
            const s=store.get(SK.UP(session.user?.email||''));
            if(s?.balance!==undefined)setUserBalance(s.balance);
            if(s?.tasksState)setGlobalUserTasksState(s.tasksState);
          }
        }
      }
    };
    init();

    // ─────────────────────────────────────────────────────────────────────
    // FIX: onAuthStateChange at App level handles the case where Supabase
    // restores its JWT asynchronously on refresh AFTER init() already ran.
    // Without this, a refresh could leave the user logged in via localStorage
    // but with stale/missing data because the JWT wasn't ready yet.
    // ─────────────────────────────────────────────────────────────────────
    const { data: { subscription } } = db.auth.onAuthStateChange(async(event, session) => {
      if (event === 'INITIAL_SESSION' && session) {
        // Session just became available — re-sync balance and tasks state
        const stored = store.get(SK.SESSION);
        if (stored && stored.role !== 'admin' && stored.user) {
          try {
            const { data } = await db.from('profiles').select('balance,tasks_state').eq('id', stored.user.id).single();
            if (data) {
              if (data.balance !== undefined) setUserBalance(data.balance);
              if (data.tasks_state) {
                const n = {};
                Object.keys(data.tasks_state).forEach(k => { n[String(k)] = data.tasks_state[k]; });
                setGlobalUserTasksState(n);
              }
            }
          } catch(e) {}
        }
      }
      if (event === 'SIGNED_OUT') {
        store.set(SK.SESSION, null);
        setScreen('landing');
        setRoleContext(null);
        setCurrentUser(null);
      }
    });

    return () => subscription.unsubscribe();
  },[]);

  // Re-sync balance/tasks on window regaining focus
  useEffect(()=>{
    const onFocus=async()=>{
      const session=store.get(SK.SESSION);
      if(session&&session.user&&session.role!=='admin'){
        try{
          const {data}=await db.from('profiles').select('balance,tasks_state').eq('id',session.user.id).single();
          if(data){
            if(data.balance!==undefined)setUserBalance(data.balance);
            if(data.tasks_state){const n={};Object.keys(data.tasks_state).forEach(k=>{n[String(k)]=data.tasks_state[k];});setGlobalUserTasksState(n);}
          }
        }catch(e){}
      }
    };
    window.addEventListener('focus',onFocus);
    return()=>window.removeEventListener('focus',onFocus);
  },[]);

  const handleLogin=async(role,profile)=>{
    setRoleContext(role);setCurrentUser(profile);
    if(role!=='admin'){
      let balance=profile.balance||(role==='premium'?1000:500),tasksState={};
      try{
        const {data}=await db.from('profiles').select('balance,tasks_state').eq('id',profile.id).single();
        if(data){
          if(data.balance!==undefined)balance=data.balance;
          if(data.tasks_state){Object.keys(data.tasks_state).forEach(k=>{tasksState[String(k)]=data.tasks_state[k];});}
        }
      }catch(e){
        const s=store.get(SK.UP(profile.email));
        if(s?.balance!==undefined)balance=s.balance;
        if(s?.tasksState)tasksState=s.tasksState;
      }
      setUserBalance(balance);setGlobalUserTasksState(tasksState);
    }
    store.set(SK.SESSION,{role,user:profile});
    setScreen('portal');
  };

  const handleLogout=async()=>{
    await db.auth.signOut();
    store.set(SK.SESSION,null);
    setScreen('landing');setRoleContext(null);setCurrentUser(null);
  };

  const handleNewUser=user=>setUserManagementRows(p=>[user,...p]);

  return(<div>
    <ToastContainer/>
    {screen==='landing'&&<LandingPage setScreen={setScreen} setPlanSelection={setPlanOverride}/>}
    {screen==='login'&&<AuthPage mode="login" setScreen={setScreen} onLoginSuccess={handleLogin}/>}
    {screen==='signup'&&<AuthPage mode="signup" setScreen={setScreen} onLoginSuccess={handleLogin} initialSelectedPlan={planOverride} onRegisterNewUser={handleNewUser}/>}
    {screen==='portal'&&(roleContext==='admin'
      ?<AdminDashboard onLogout={handleLogout} globalTasksList={globalTasksList} setGlobalTasksList={setGlobalTasksList} userManagementRows={userManagementRows} setUserManagementRows={setUserManagementRows} withdrawalsList={withdrawalsList} setWithdrawalsList={setWithdrawalsList}/>
      :<UserDashboard plan={roleContext} onLogout={handleLogout} globalTasksList={globalTasksList} setGlobalTasksList={setGlobalTasksList} userBalance={userBalance} setUserBalance={setUserBalance} globalUserTasksState={globalUserTasksState} setGlobalUserTasksState={setGlobalUserTasksState} currentUser={currentUser}/>
    )}
  </div>);
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
