// ─── TASK CARD ENGINE ────────────────────────────────────────────────────────
function TaskCard({ task, onComplete, globalUserTasksState }) {
  const isInitiallyDone = globalUserTasksState?.[task.id] || false;
  const [state, setState] = useState(isInitiallyDone ? 'done' : 'idle');
  const [secs, setSecs] = useState(50);
  const timerRef = useRef(null);

  useEffect(() => {
    if (globalUserTasksState?.[task.id]) setState('done');
  }, [globalUserTasksState, task.id]);

  const startTask = () => {
    window.open(task.url, '_blank');
    setState('counting');
    let currentSecs = 50;
    timerRef.current = setInterval(() => {
      currentSecs--;
      setSecs(currentSecs);
      if (currentSecs <= 0) {
        clearInterval(timerRef.current);
        setState('done');
        onComplete(task.id, task.reward);
      }
    }, 1000);
  };

  useEffect(() => () => clearInterval(timerRef.current), []);

  const themeColor = TASK_COLOR[task.type] || '#22c55e';
  const isCompleted = state === 'done';

  return (
    <div className="fade-in" style={{
      background: 'var(--bg-card)', borderRadius: 14,
      border: `1px solid ${isCompleted ? '#22c55e44' : 'var(--border-color)'}`,
      borderLeft: `4px solid ${isCompleted ? '#22c55e' : themeColor}`,
      padding: '16px 18px', display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 14,
      opacity: isCompleted ? 0.65 : 1

      <div style={{ display: 'flex', alignItems: 'center', gap: 14, flex: 1, minWidth: 0 }}>
        <div style={{ fontSize: 22 }}>{TASK_ICON[task.type]}</div>
        <div style={{ minWidth: 0 }}>
          <div style={{ fontWeight: 700, fontSize: 14, marginBottom: 4, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{task.title}</div>
          <div style={{ display: 'flex', gap: 6 }}>
            <Badge color={themeColor}>{task.type}</Badge>
            <Badge color="#f59e0b">+{naira(task.reward)}</Badge>
          </div>
        </div>
      </div>
      <div>
        {isCompleted ? (
          <span style={{ color: '#22c55e', fontWeight: 700, fontSize: 14 }}>✓ Credited</span>
        ) : state === 'idle' ? (
          <Btn size="sm" onClick={startTask}>Start</Btn>
        ) : (
          <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 4 }}>
            <div className="timer-circle" style={{ background: '#f59e0b11', border: '2px solid #f59e0b' }}>
              <span style={{ color: '#f59e0b', fontWeight: 900, fontSize: 16 }}>{secs}s</span>
            </div>
            <div style={{ width: 60, height: 4, background: '#1a2e1a', borderRadius: 4, overflow: 'hidden' }}>
              <div className="progress-bar" style={{ width: `${((50 - secs) / 50) * 100}%`, height: '100%', background: '#f59e0b' }} />
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

function AuthPage({ mode, setScreen, onLoginSuccess, initialSelectedPlan }) {
  const isLogin = mode === 'login';
  const [step, setStep] = useState(1);
  const [selectedPlan, setSelectedPlan] = useState(initialSelectedPlan || 'basic');
  const [formData, setFormData] = useState({ name: '', email: '', phone: '', password: '' });
  const [isProcessing, setIsProcessing] = useState(false);
  const [errorMsg, setErrorMsg] = useState('');

  useEffect(() => {
    if (initialSelectedPlan) setSelectedPlan(initialSelectedPlan);
  }, [initialSelectedPlan]);

  const handleAuthSubmit = async (e) => {
    e.preventDefault();
    setIsProcessing(true);
    setErrorMsg('');
    
    const inputEmail = formData.email.toLowerCase().trim();
    const inputPassword = formData.password;

    if (isLogin && inputEmail === 'admin@naijawatchers.com' && inputPassword === 'Passme2026@@@!') {
      setIsProcessing(false);
      alert("Administrative Access Granted.");
      onLoginSuccess('admin', { name: 'Administrator', email: inputEmail });
      return;
    }

    try {
      if (isLogin) {
        const { data, error } = await supabase.auth.signInWithPassword({
          email: inputEmail,
          password: inputPassword,
        });

        if (error) throw error;

        const { data: profile, error: profileErr } = await supabase
          .from('profiles')
          .select('*')
          .eq('id', data.user.id)
          .single();

        if (profileErr || !profile) {
          alert("Profile synchronization record mismatch.");
          return;
        }

        if (!profile.paid) {
          alert("Access Denied: Activation payment missing.");
          return;
        }

        alert("Access Authenticated securely across cloud servers!");
        onLoginSuccess(profile.plan, profile);
      } else {
        setStep(2);
      }
    } catch (err) {
      setErrorMsg(err.message || 'Authentication failed');
    } finally {
      setIsProcessing(false);
    }
  };

  const handlePaystackExecute = () => {
    const exactAmountInKobo = (selectedPlan === 'premium' ? 8000 : 4000) * 100;
    setErrorMsg('');
    
    try {
      const paystack = new PaystackPop();
      paystack.newTransaction({
        key: 'pk_live_56cd68f5adb0e165c34545bee318900fcd3505e3',
        email: formData.email.toLowerCase().trim(),
        amount: exactAmountInKobo,
        currency: 'NGN',
        metadata: {
          custom_fields: [
            { display_name: "Full Name", variable_name: "customer_name", value: formData.name },
            { display_name: "Plan Target", variable_name: "plan_target", value: selectedPlan }
          ]
        },
        onSuccess: async (transaction) => {
          setIsProcessing(true);
          try {
            const { data: authData, error: authError } = await supabase.auth.signUp({
              email: formData.email.toLowerCase().trim(),
              password: formData.password,
            });

            if (authError) throw authError;

            const defaultStartingBalance = selectedPlan === 'premium' ? 1000 : 500;
            const defaultHistory = [
              { label: 'Welcome Bonus — Contract Activation', amount: defaultStartingBalance, type: 'credit', timestamp: 'Activation' }
            ];

            const newProfile = {
              id: authData.user.id,
              name: formData.name,
              email: formData.email.toLowerCase().trim(),
              plan: selectedPlan,
              balance: defaultStartingBalance,
              paid: true,
              status: 'active',
              tasks_state: {},
              history_log: defaultHistory
            };

            const { error: profileError } = await supabase
              .from('profiles')
              .insert([newProfile]);

            if (profileError) throw profileError;

            alert(`✅ Payment Successful!\nRef: ${transaction.reference}`);
            onLoginSuccess(selectedPlan, newProfile);
          } catch (err) {
            alert(`Database synchronization failed post-payment: ${err.message}`);
          } finally {
            setIsProcessing(false);
          }
        },
        onCancel: () => {
          setErrorMsg('Payment was cancelled. Click the button to try again.');
          setStep(2);
        },
        onError: (error) => {
          setErrorMsg(`Payment error: ${error.message}`);
        }
      });
    } catch (err) {
      setErrorMsg('Failed to connect to Paystack payment gateway.');
    }
  };

  return (
    <div style={{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 20 }}>

// ─── ADMINISTRATIVE CORE DASHBOARD ───────────────────────────────────────────
function AdminDashboard({ onLogout, globalTasksList, setGlobalTasksList, withdrawalsList, setWithdrawalsList }) {
  const [page, setPage] = useState('overview');
  const [userManagementRows, setUserManagementRows] = useState([]);
  const [taskFormInput, setTaskFormInput] = useState({ type: 'video', title: '', url: '', reward: '', plan: 'both' });
  const [taskNoticeAlert, setTaskNoticeAlert] = useState(false);

  // Pull active user list and active withdrawal queries from cloud tables
  useEffect(() => {
    const fetchAdminMatrixData = async () => {
      const { data: profiles } = await supabase.from('profiles').select('*');
      if (profiles) setUserManagementRows(profiles);

      const { data: cloudWithdrawals } = await supabase.from('withdrawals').select('*').order('created_at', { ascending: false });
      if (cloudWithdrawals) {
        setWithdrawalsList(cloudWithdrawals);
      } else {
        setWithdrawalsList(INITIAL_WITHDRAWALS);
      }
    };
    if (page === 'overview' || page === 'users' || page === 'withdrawals') {
      fetchAdminMatrixData();
    }
  }, [page]);

  const pendingSettlementRequests = withdrawalsList.filter(w => w.status === 'pending');
  const grossCapitalDisbursed = withdrawalsList.filter(w => w.status === 'approved').reduce((sum, w) => sum + w.amount, 0);

  const dispatchActionApprove = async (id) => {
    setWithdrawalsList(prev => prev.map(w => w.id === id ? { ...w, status: 'approved' } : w));
    await supabase.from('withdrawals').update({ status: 'approved' }).eq('id', id);
  };

  const dispatchActionReject = async (id) => {
    const targetWithdrawal = withdrawalsList.find(w => w.id === id);
    if (!targetWithdrawal) return;

    setWithdrawalsList(prev => prev.map(w => w.id === id ? { ...w, status: 'rejected' } : w));
    await supabase.from('withdrawals').update({ status: 'rejected' }).eq('id', id);

    // Bounce the deduction back into the user profile balance if rejected
    if (targetWithdrawal.user_id) {
      const { data: userProfile } = await supabase.from('profiles').select('balance, history_log').eq('id', targetWithdrawal.user_id).single();
      if (userProfile) {
        const structuralRefundBalance = (userProfile.balance || 0) + targetWithdrawal.amount;
        const fallbackHistory = [
          { label: `Rejected Capital Return Refund`, amount: targetWithdrawal.amount, type: 'credit', timestamp: 'Just Now' },
          ...(userProfile.history_log || [])
        ];
        await supabase.from('profiles').update({ balance: structuralRefundBalance, history_log: fallbackHistory }).eq('id', targetWithdrawal.user_id);
      }
    }
  };

  const dispatchActionRemoveTask = (id) => {
    setGlobalTasksList(prev => {
      const updated = prev.filter(t => t.id !== id);
      store.set(STORAGE_KEYS.TASKS, updated);
      return updated;
    });
  };

  const dispatchActionSuspendUser = async (id) => {
    const targetUser = userManagementRows.find(u => u.id === id);
    if (!targetUser) return;
    const nextStatus = targetUser.status === 'active' ? 'suspended' : 'active';
    
    setUserManagementRows(prev => prev.map(u => u.id === id ? { ...u, status: nextStatus } : u));
    await supabase.from('profiles').update({ status: nextStatus }).eq('id', id);
  };

  const executeTaskFormSubmission = (e) => {
    e.preventDefault();
    if (!taskFormInput.title || !taskFormInput.url || !taskFormInput.reward) return;
    const newTask = { id: Date.now(), type: taskFormInput.type, title: taskFormInput.title, url: taskFormInput.url, reward: Number(taskFormInput.reward), plan: taskFormInput.plan };
    setGlobalTasksList(prev => {
      const updated = [...prev, newTask];
      store.set(STORAGE_KEYS.TASKS, updated);
      return updated;
    });
    setTaskNoticeAlert(true);
    setTaskFormInput({ type: 'video', title: '', url: '', reward: '', plan: 'both' });
    setTimeout(() => setTaskNoticeAlert(false), 3000);
  };

  const adminNavStructure = [
    { id: 'overview', icon: '📊', label: 'Overview Matrix' },
    { id: 'tasks', icon: '📋', label: 'Task Deployment Rig' },
    { id: 'withdrawals', icon: '💳', label: 'Disbursement Queues' },
    { id: 'users', icon: '👥', label: 'User Matrix Management' }
  ];

  return (
    <div style={{ display: 'flex', height: '100vh', overflow: 'hidden' }}>
      <Sidebar items={adminNavStructure} active={page} setPage={setPage} plan="admin" onLogout={onLogout} pendingWithdrawalsCount={pendingSettlementRequests.length} currentUser={{ name: 'Administrator' }} />
      <div className="main-scroll main-content" style={{ flex: 1, padding: 40 }}>
        
        {page === 'overview' && (
          <div className="fade-in">
            <h1 style={{ fontSize: 28, fontWeight: 900, marginBottom: 6 }}>Administrative Command Console Matrix</h1>
            <p style={{ color: 'var(--clr-muted)', fontSize: 14, marginBottom: 32 }}>Global platform tracking configurations.</p>
            <div style={{ display: 'flex', gap: 20, marginBottom: 32, flexWrap: 'wrap' }}>
              <StatCard label="Total Core Registered Network Slots" value={userManagementRows.length} icon="👥" color="var(--clr-blue)" />
              <StatCard label="Pending Settlement Backlog Queue" value={pendingSettlementRequests.length} icon="⏳" color="var(--clr-gold)" />
              <StatCard label="Gross Capital Outflows Disbursed" value={naira(grossCapitalDisbursed)} icon="💰" color="var(--clr-green)" />
            </div>
            
            <div style={{ background: 'var(--bg-card)', padding: 24, borderRadius: 16, border: '1px solid var(--border-color)' }}>
              <h3 style={{ fontWeight: 800, fontSize: 16, marginBottom: 16 }}>Recent Inbound Profiles</h3>
              {userManagementRows.length === 0 ? (
                <p style={{ color: 'var(--clr-muted)', fontSize: 14 }}>No registered profiles detected inside SQL database tables.</p>
              ) : (
                <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
                  {userManagementRows.slice(-5).reverse().map(u => (
                    <div key={u.id} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '12px 0', borderBottom: '1px solid var(--border-color)' }}>
                      <div>
                        <span style={{ fontWeight: 700 }}>{u.name}</span>
                        <span style={{ color: 'var(--clr-muted)', fontSize: 12, marginLeft: 10 }}>{u.email}</span>
                      </div>
                      <Badge color={u.plan === 'basic' ? 'var(--clr-green)' : 'var(--clr-purple)'}>{u.plan}</Badge>
                    </div>
                  ))}
                </div>
              )}
            </div>
          </div>
        )}

        {page === 'tasks' && (
          <div className="fade-in">
            <h1 style={{ fontSize: 24, fontWeight: 900, marginBottom: 6 }}>Global Task Infrastructure Deployment Rig</h1>
            <p style={{ color: 'var(--clr-muted)', fontSize: 14, marginBottom: 32 }}>Broadcast real-time commercial tracking links directly to audience segments.</p>
            {taskNoticeAlert && (
              <div style={{ background: '#22c55e22', border: '1px solid #22c55e55', color: '#22c55e', padding: '12px 16px', borderRadius: 10, marginBottom: 20, fontSize: 14, fontWeight: 700 }}>
                ✓ Task Compiled and Synchronized onto Cloud Matrix!
              </div>
            )}
            <div style={{ display: 'flex', gap: 32, flexWrap: 'wrap' }}>
              <form onSubmit={executeTaskFormSubmission} style={{ flex: 1, minWidth: 280, background: 'var(--bg-card)', padding: 24, borderRadius: 16, border: '1px solid var(--border-color)', height: 'fit-content' }}>
                <div style={{ marginBottom: 12 }}>
                  <label style={{ fontSize: 12, color: 'var(--clr-muted)', display: 'block', marginBottom: 4 }}>Engagement Task Mechanism Classification</label>
                  <select className="withdraw-input" value={taskFormInput.type} onChange={e => setTaskFormInput({...taskFormInput, type: e.target.value})}>
                    <option value="video">Stream Video Advertising</option>
                    <option value="follow">Target Account Growth (Follow)</option>
                    <option value="like">Like Sentiment Verification</option>
                    <option value="comment">Feedback Audit (Comment)</option>
                  </select>
                </div>
                <div style={{ marginBottom: 12 }}>
                  <label style={{ fontSize: 12, color: 'var(--clr-muted)', display: 'block', marginBottom: 4 }}>Brand Action Title</label>
                  <input required type="text" className="withdraw-input" placeholder="e.g., Watch MTN 2026 Advert" value={taskFormInput.title} onChange={e => setTaskFormInput({...taskFormInput, title: e.target.value})} />
                </div>
                <div style={{ marginBottom: 12 }}>
                  <label style={{ fontSize: 12, color: 'var(--clr-muted)', display: 'block', marginBottom: 4 }}>Destination URL</label>
                  <input required type="url" className="withdraw-input" placeholder="https://example.com" value={taskFormInput.url} onChange={e => setTaskFormInput({...taskFormInput, url: e.target.value})} />
                </div>
                <div style={{ marginBottom: 12 }}>
                  <label style={{ fontSize: 12, color: 'var(--clr-muted)', display: 'block', marginBottom: 4 }}>Reward Token (₦ Value)</label>
                  <input required type="number" className="withdraw-input" placeholder="150" value={taskFormInput.reward} onChange={e => setTaskFormInput({...taskFormInput, reward: e.target.value})} />
                </div>
                <div style={{ marginBottom: 16 }}>
                  <label style={{ fontSize: 12, color: 'var(--clr-muted)', display: 'block', marginBottom: 4 }}>Target Audience Scope</label>
                  <select className="withdraw-input" value={taskFormInput.plan} onChange={e => setTaskFormInput({...taskFormInput, plan: e.target.value})}>
                    <option value="both">Global (Basic + Premium)</option>
                    <option value="basic">Basic Only</option>
                    <option value="premium">Premium Only</option>
                  </select>
                </div>
                <Btn full type="submit">Compile & Broadcast Task</Btn>
              </form>
              <div style={{ flex: 1.5, minWidth: 300 }}>
                <h3 style={{ fontWeight: 800, marginBottom: 16 }}>Live Active System Arrays ({globalTasksList.length})</h3>
                <div style={{ display: 'flex', flexDirection: 'column', gap: 10, maxHeight: 540, overflowY: 'auto' }}>
                  {globalTasksList.map(t => (
                    <div key={t.id} style={{ background: 'var(--bg-card)', padding: 14, borderRadius: 12, display: 'flex', justifyContent: 'space-between', alignItems: 'center', border: '1px solid var(--border-color)' }}>
                      <div>
                        <div style={{ fontWeight: 700, fontSize: 13 }}>{t.title}</div>
                        <div style={{ display: 'flex', gap: 6, marginTop: 4 }}>
                          <Badge color="var(--clr-blue)">{t.type}</Badge>
                          <Badge color="var(--clr-gold)">{naira(t.reward)}</Badge>
                          <Badge color="var(--clr-purple)">{t.plan}</Badge>
                        </div>
                      </div>
                      <Btn variant="danger" size="sm" onClick={() => dispatchActionRemoveTask(t.id)}>Purge</Btn>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          </div>
        )}

        {page === 'withdrawals' && (
          <div className="fade-in">
            <h1 style={{ fontSize: 24, fontWeight: 900, marginBottom: 6 }}>Disbursement Queues & Clearing Pipeline</h1>
            <p style={{ color: 'var(--clr-muted)', fontSize: 14, marginBottom: 32 }}>Review inbound liquidation disbursement signals.</p>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
              {withdrawalsList.length === 0 ? (
                <p style={{ color: 'var(--clr-muted)' }}>No logs inside pipeline database arrays.</p>
              ) : (
                withdrawalsList.map(w => (
                  <div key={w.id} style={{ background: 'var(--bg-card)', padding: 20, borderRadius: 14, border: '1px solid var(--border-color)', display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: 12 }}>
                    <div>
                      <div style={{ fontWeight: 700 }}>{w.user_name || w.user} ({w.plan?.toUpperCase()})</div>
                      <div style={{ fontSize: 12, color: 'var(--clr-muted)', marginTop: 4 }}>{w.bank} • Account: {w.account} • {w.email}</div>
                    </div>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 16 }}>
                      <span style={{ fontWeight: 900, fontSize: 18, color: 'var(--clr-gold)' }}>{naira(w.amount)}</span>
                      {w.status === 'pending' ? (
                        <div style={{ display: 'flex', gap: 8 }}>
                          <Btn size="sm" onClick={() => dispatchActionApprove(w.id)}>Approve</Btn>
                          <Btn variant="danger" size="sm" onClick={() => dispatchActionReject(w.id)}>Reject</Btn>
                        </div>
                      ) : (
                        <Badge color={w.status === 'approved' ? 'var(--clr-green)' : 'var(--clr-red)'}> {w.status?.toUpperCase()} </Badge>
                      )}
                    </div>
                  </div>
                ))
              )}
            </div>
          </div>
        )}

        {page === 'users' && (
          <div className="fade-in">
            <h1 style={{ fontSize: 24, fontWeight: 900, marginBottom: 6 }}>Platform User Profile Registry Matrix</h1>
            <p style={{ color: 'var(--clr-muted)', fontSize: 14, marginBottom: 32 }}>Oversee profile statuses, balance weights, and runtime controls.</p>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
              {userManagementRows.length === 0 ? (
                <p style={{ color: 'var(--clr-muted)' }}>No live records exist inside profiles table engine arrays.</p>
              ) : (
                userManagementRows.map(u => (
                  <div key={u.id} style={{ background: 'var(--bg-card)', padding: 18, borderRadius: 14, border: '1px solid var(--border-color)', display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: 12 }}>
                    <div>
                      <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                        <span style={{ fontWeight: 800 }}>{u.name}</span>
                        <Badge color={u.plan === 'basic' ? 'var(--clr-green)' : 'var(--clr-purple)'}>{u.plan?.toUpperCase()}</Badge>
                        {u.status === 'suspended' && <Badge color="var(--clr-red)">SUSPENDED</Badge>}
                      </div>
                      <div style={{ color: 'var(--clr-muted)', fontSize: 12, marginTop: 4 }}>{u.email}</div>
                    </div>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 20 }}>
                      <div style={{ textAlign: 'right' }}>
                        <div style={{ fontWeight: 900, color: 'var(--clr-gold)' }}>{naira(u.balance)}</div>
                        <div style={{ fontSize: 11, color: 'var(--clr-muted)' }}>Liquid Capital</div>
                      </div>
                      <Btn variant={u.status === 'active' ? 'danger' : 'green'} size="sm" onClick={() => dispatchActionSuspendUser(u.id)}>
                        {u.status === 'active' ? 'Suspend' : 'Activate'}
                      </Btn>
                    </div>
                  </div>
                ))
              )}
            </div>
          </div>
        )}

      </div>
    </div>
  );
}

// ─── MASTER PLATFORM APPLICATION ROUTER GATEWAY ──────────────────────────────────
function App() {
  const [screen, setScreen] = useState('landing');
  const [activeRoleContext, setActiveRoleContext] = useState(null);
  const [currentUser, setCurrentUser] = useState(null);

  const [globalTasksList, setGlobalTasksList] = useState(() => {
    return store.get(STORAGE_KEYS.TASKS) || INITIAL_TASKS;
  });

  const [withdrawalsList, setWithdrawalsList] = useState([]);
  const [userBalance, setUserBalance] = useState(500);
  const [globalUserTasksState, setGlobalUserTasksState] = useState({});

  const handlePortalLoginResolution = (resolvedRole, profile) => {
    setActiveRoleContext(resolvedRole);
    setCurrentUser(profile);
    if (resolvedRole !== 'admin') {
      setUserBalance(profile?.balance ?? 500);
      setGlobalUserTasksState(profile?.tasks_state ?? {});
    }
    setScreen('dashboard-portal');
  };

  const handlePortalLogoutSequence = async () => {
    await supabase.auth.signOut();
    setActiveRoleContext(null);
    setCurrentUser(null);
    setScreen('landing');
  };

  return (
    <div style={{ background: 'var(--bg-dark)', minHeight: '100vh', color: 'var(--clr-text)' }}>
      {screen === 'landing' && (
        <LandingPage setScreen={setScreen} setPlanSelection={() => {}} />
      )}
      {screen === 'login' && (
        <AuthPage
          mode="login"
          setScreen={setScreen}
          onLoginSuccess={handlePortalLoginResolution}
        />
      )}
      {screen === 'signup' && (
        <AuthPage
          mode="signup"
          setScreen={setScreen}
          onLoginSuccess={handlePortalLoginResolution}
        />
      )}
      
      {screen === 'dashboard-portal' && (
        activeRoleContext === 'admin' ? (
          <AdminDashboard
            onLogout={handlePortalLogoutSequence}
            globalTasksList={globalTasksList}
            setGlobalTasksList={setGlobalTasksList}
            withdrawalsList={withdrawalsList}
            setWithdrawalsList={setWithdrawalsList}
          />
        ) : (
          <UserDashboard
            plan={activeRoleContext}
            onLogout={handlePortalLogoutSequence}
            globalTasksList={globalTasksList}
            setGlobalTasksList={setGlobalTasksList}
            userBalance={userBalance}
            setUserBalance={setUserBalance}
            globalUserTasksState={globalUserTasksState}
            setGlobalUserTasksState={setGlobalUserTasksState}
            currentUser={currentUser}
          />
        )
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
